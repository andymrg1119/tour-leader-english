<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>领队英语学习台</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#1a1a2e;--mute:#8892a4;--teal:#0ea5a4;--teal-l:#e6f7f7;--red:#e74c3c;--red-l:#fdeaea;--orange:#f39c12;--orange-l:#fef5e7;--green:#27ae60;--green-l:#eafaf1;--border:#e8ecf1;--shadow:0 2px 8px rgba(0,0,0,.06);--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#0ea5a4,#0891b2);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(14,165,164,.2)}
.header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:12px;opacity:.8;margin-top:2px}
.container{max-width:800px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;min-height:44px;font-family:var(--font)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:#0891b2}
.btn-outline{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn-sm{padding:6px 12px;font-size:12px;min-height:36px}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--mute);border:1px solid var(--border)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-teal{background:var(--teal-l);color:var(--teal)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-orange{background:var(--orange-l);color:var(--orange)}
.today-banner{background:linear-gradient(135deg,#fef5e7,#fff7ed);border-left:4px solid var(--orange);padding:12px 16px;border-radius:var(--radius);margin-bottom:12px}
.today-banner.overdue{background:linear-gradient(135deg,#fdeaea,#fef2f2);border-left-color:var(--red)}
.today-label{font-size:13px;font-weight:700;color:var(--orange);margin-bottom:6px}
.overdue .today-label{color:var(--red)}
.dialogue-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.dialogue-unit{font-size:13px;color:var(--mute);font-weight:500}
.dialogue-title{font-size:17px;font-weight:700;margin:2px 0}
/* dialogue turns - script style */
.turn{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:#f8fafc;border-left:3px solid #cbd5e1}
.turn.leader{background:var(--teal-l);border-left-color:var(--teal)}
.turn-speaker{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.turn.leader .turn-speaker{color:var(--teal)}
.turn:not(.leader) .turn-speaker{color:#64748b}
.speaker-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.turn-en{font-size:15px;font-weight:600;line-height:1.55;margin-bottom:3px}
.turn-zh{font-size:13px;color:var(--mute);margin-bottom:6px}
.turn.leader .turn-zh{color:#0f766e;opacity:.75}
.turn-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.speak-btn{background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:4px;color:var(--teal);font-family:var(--font)}
.speak-btn:hover{background:var(--teal-l)}
.speak-btn.slow{color:var(--orange)}
.expand-btn{background:none;border:none;color:var(--teal);font-size:12px;cursor:pointer;padding:6px 0;font-family:var(--font);min-height:36px}
.detail-panel{display:none;margin-top:8px;padding:10px;background:#fff;border-radius:6px;border:1px solid var(--border)}
.detail-panel.show{display:block}
.word-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.word-table td{padding:4px 8px;border-bottom:1px solid var(--border)}
.word-table td:first-child{font-weight:600;color:var(--teal);white-space:nowrap}
.turn-words{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.wchip{display:inline-flex;align-items:center;gap:3px;background:var(--teal-l);border:1px solid var(--border);border-radius:14px;padding:2px 5px 2px 4px;font-size:12px;line-height:1.4}
.wpron{background:none;border:none;cursor:pointer;font-family:var(--font);color:#0f766e;font-size:12px;display:inline-flex;align-items:center;gap:3px;padding:3px 4px;border-radius:10px;font-weight:600;min-height:28px}
.wpron:hover{background:#d6ecec}
.wpron svg{color:var(--teal);flex-shrink:0}
.wzh{color:var(--mute);font-size:11px}
.wstar{background:none;border:none;cursor:pointer;color:#cbd5e1;font-size:14px;line-height:1;padding:2px 5px;border-radius:8px;min-width:26px;min-height:26px}
.wstar.active{color:#f59e0b}
.word-speak{background:none;border:none;cursor:pointer;color:var(--teal);padding:2px 4px;margin-left:4px;vertical-align:middle;display:inline-flex;align-items:center;min-height:28px;min-width:28px;justify-content:center;border-radius:4px}
.word-speak:hover{background:var(--teal-l)}
.word-bookmark{background:none;border:none;cursor:pointer;color:#cbd5e1;padding:2px 4px;vertical-align:middle;display:inline-flex;align-items:center;min-height:28px;min-width:28px;justify-content:center;border-radius:4px}
.word-bookmark:hover{background:var(--orange-l)}
.word-bookmark.active{color:var(--orange)}
.wb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:var(--card);border-radius:8px;border:1px solid var(--border)}
.wb-item .wb-word{font-weight:600;color:var(--teal);font-size:15px;min-width:80px}
.wb-item .wb-zh{font-size:13px;color:var(--mute);flex:1}
.wb-item .wb-src{font-size:11px;color:var(--mute);white-space:nowrap}
.wb-review-card{text-align:center;padding:30px 20px}
.wb-review-word{font-size:28px;font-weight:700;color:var(--teal);margin-bottom:8px}
.wb-review-zh{font-size:16px;color:var(--mute);margin-bottom:20px;min-height:24px}
.wb-options{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto}
.wb-opt{padding:14px;border:2px solid var(--border);border-radius:10px;background:#fff;font-size:14px;cursor:pointer;min-height:48px;font-family:var(--font);transition:all .15s}
.wb-opt:hover{border-color:var(--teal)}
.wb-opt.correct{border-color:var(--green);background:var(--green-l)}
.wb-opt.wrong{border-color:var(--red);background:var(--red-l)}
.grammar-box{font-size:12px;padding:8px;background:var(--orange-l);border-radius:6px;margin-bottom:6px;line-height:1.5}
.usage-box{font-size:12px;padding:8px;background:#f0f4ff;border-radius:6px;line-height:1.5}
.play-all{width:100%;margin-bottom:12px}
.course-unit{margin-bottom:16px}
.course-unit-header{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--teal-l)}
.course-item{display:flex;align-items:center;padding:10px 12px;margin-bottom:6px;background:var(--card);border-radius:8px;border:1px solid var(--border);gap:10px;font-size:14px;cursor:pointer}
.course-item:hover{border-color:var(--teal)}
.course-item.learned{background:var(--green-l)}
.course-item .num{width:28px;height:28px;border-radius:50%;background:var(--teal-l);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.course-item.learned .num{background:var(--green);color:#fff}
.course-item .info{flex:1;min-width:0}
.course-item .info .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-item .info .stat{font-size:11px;color:var(--mute)}
.heatmap{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0}
.heatmap-cell{width:14px;height:14px;border-radius:2px;background:#e8ecf1}
.heatmap-cell.done{background:var(--teal)}
.heatmap-cell.miss{background:var(--red-l)}
.streak-box{display:flex;gap:12px;flex-wrap:wrap}
.streak-stat{flex:1;min-width:100px;text-align:center;padding:14px 8px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)}
.streak-stat .num{font-size:28px;font-weight:800;color:var(--teal)}
.streak-stat .label{font-size:11px;color:var(--mute);margin-top:2px}
.tab-nav{display:flex;background:var(--card);border-radius:var(--radius);padding:4px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border);position:sticky;top:72px;z-index:50;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{flex:1 0 auto;white-space:nowrap;padding:10px 14px;text-align:center;font-size:14px;font-weight:600;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--mute);transition:all .15s;min-height:44px;font-family:var(--font)}
.tab-btn.active{background:var(--teal);color:#fff;box-shadow:0 1px 4px rgba(14,165,164,.3)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:400px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal h3{margin-bottom:12px}
.modal p{font-size:14px;color:var(--mute);margin-bottom:16px;line-height:1.5}
.modal .row{justify-content:flex-end}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.backup-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.backup-bar .btn{font-size:12px;padding:6px 10px;min-height:36px}
.cards-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:8px}
.cards-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px}
.cards-bar-fill{height:100%;background:var(--teal);width:0;transition:width .3s}
.flip-card{perspective:1200px;margin-bottom:14px}
.flip-inner{position:relative;width:100%;min-height:220px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.flip-face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#f0f9f9,#e6f4f4)}
.fc-word{font-size:32px;font-weight:700;color:#0f766e;word-break:break-word;line-height:1.2}
.fc-ipa{font-size:16px;color:var(--mute);margin-top:8px}
.fc-hint{position:absolute;bottom:14px;font-size:12px;color:var(--mute)}
.fc-zh{font-size:26px;font-weight:600;color:var(--text);line-height:1.4}
.fc-src{font-size:12px;color:var(--mute);margin-top:10px}
.cards-actions{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.cards-actions .btn{min-width:96px}
.cards-nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.card-speak{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--teal);min-width:40px;min-height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.card-speak:hover{background:var(--teal-l)}
.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:6px 0;padding-bottom:env(safe-area-inset-bottom);z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
.mobile-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;color:var(--mute);font-size:11px;cursor:pointer;padding:6px;min-height:50px;font-family:var(--font)}
.mobile-tab.active{color:var(--teal)}
.mobile-tab svg{width:22px;height:22px}
.review-item{display:flex;align-items:center;justify-content:space-between;padding:10px;margin-bottom:6px;background:#fff;border-radius:8px;border:1px solid var(--border);font-size:13px;gap:8px}
.review-item .name{font-weight:600}
@media(max-width:768px){
  .container{padding:8px 10px}
  .header{padding:12px 16px}
  .header h1{font-size:18px}
  .tab-nav{display:none}
  .mobile-tab{font-size:10px;padding:4px 2px}
  .card{padding:12px}
  .mobile-tabs{display:flex}
  body{padding-bottom:70px}
  .streak-stat .num{font-size:22px}
  .backup-bar .btn{font-size:11px}
  input,select,textarea{font-size:16px!important}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1.5s ease-in-out infinite}
.word-search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;font-family:var(--font)}
.word-search:focus{border-color:var(--teal)}
.word-group-title{font-size:13px;font-weight:800;color:var(--teal);margin:14px 0 6px;padding-left:4px}
.word-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.word-main{flex:1;min-width:0}
.word-en{font-size:15px;font-weight:700}
.word-ipa{font-size:12px;color:var(--teal);font-family:Georgia,serif;margin-top:1px}
.word-zh{font-size:13px;color:var(--mute);text-align:right;flex-shrink:0;max-width:40%}
.word-src{font-size:11px;color:#b6bfc9;margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <h1>领队英语学习台</h1>
  <div class="sub">基于《领队英语》第6版（袁智敏·仉向明 著）| 33段完整对话 · 每日一段新课+一段复习</div>
</div>
<div class="container">
  <div class="backup-bar">
    <button class="btn btn-ghost btn-sm" onclick="exportData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      导出备份
    </button>
    <button class="btn btn-ghost btn-sm" onclick="importData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      导入恢复
    </button>
    <button class="btn btn-ghost btn-sm" onclick="clearData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      清空
    </button>
    <span id="dataHint" style="font-size:11px;color:var(--orange);display:none;align-self:center"></span>
  </div>
  <div id="todayAlert"></div>
  <div class="tab-nav" id="tabNav">
    <button class="tab-btn active" onclick="switchTab('today')">今日学习</button>
    <button class="tab-btn" onclick="switchTab('courses')">全部课程</button>
    <button class="tab-btn" onclick="switchTab('words')">单词表</button>
    <button class="tab-btn" onclick="switchTab('cards')">单词卡</button>
    <button class="tab-btn" onclick="switchTab('wordbook')">生词本</button>
    <button class="tab-btn" onclick="switchTab('progress')">打卡进度</button>
  </div>
  <div class="tab-panel active" id="panel-today"><div id="todayContent"></div></div>
  <div class="tab-panel" id="panel-courses"><div id="coursesContent"></div></div>
  <div class="tab-panel" id="panel-words"><div id="wordsContent"></div></div>
  <div class="tab-panel" id="panel-cards"><div id="cardsContent"></div></div>
  <div class="tab-panel" id="panel-wordbook"><div id="wordbookContent"></div></div>
  <div class="tab-panel" id="panel-progress"><div id="progressContent"></div></div>
</div>
<div class="mobile-tabs" id="mobileTabs">
  <button class="mobile-tab active" onclick="switchTab('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    今日学习
  </button>
  <button class="mobile-tab" onclick="switchTab('courses')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    全部课程
  </button>
  <button class="mobile-tab" onclick="switchTab('words')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 3v18"/><line x1="12" y1="8" x2="16" y2="8"/><line x1="12" y1="12" x2="16" y2="12"/><line x1="12" y1="16" x2="16" y2="16"/></svg>
    单词表
  </button>
  <button class="mobile-tab" onclick="switchTab('cards')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M6 9h6"/><path d="M6 13h4"/><path d="M18 9h4v10a2 2 0 0 1-2 2H8"/></svg>
    单词卡
  </button>
  <button class="mobile-tab" onclick="switchTab('wordbook')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    生词本
  </button>
  <button class="mobile-tab" onclick="switchTab('progress')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    打卡进度
  </button>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="clearModal">
  <div class="modal">
    <h3>确认清空</h3>
    <p>将清除所有学习记录和打卡数据，此操作不可撤销。建议先导出备份。</p>
    <div class="row">
      <button class="btn btn-ghost" onclick="closeClearModal()">取消</button>
      <button class="btn btn-red" onclick="doClear()">确认清空</button>
    </div>
  </div>
</div>
