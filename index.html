<script>
const DIALOGUE_UNITS = [{"id":"d001","unit":"第一单元 在机场","unit_id":1,"name":"1.1 在问讯处","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Could you tell me where I can check in for CA 112 to Seoul?","zh":"请问前往首尔的CA112航班在哪里办理登机手续？","words":[["check in","办理登机"],["CA 112","航班号CA112"],["Seoul","首尔"],["could you tell me","请问你能告诉我"],["a group of","一行/一队"]],"grammar":"Could you tell me where... 是间接疑问句，where引导宾语从句用陈述语序；check in 固定短语表\"办理登机\"。","usage":"对应《领队英语》第一单元第1课「At the Information Desk（在问讯处）」，领队到达机场后第一件事——找到值机柜台。"},{"speaker":"问讯处职员","side":"other","en":"CA 112 to Seoul departs from Terminal 3. The check-in counters are D12 to D16.","zh":"CA112飞首尔的航班在3号航站楼出发，值机柜台是D12到D16。","words":[["Terminal 3","3号航站楼"],["check-in counters","值机柜台"],["depart from","从...出发"]],"grammar":"depart from 从…出发；The check-in counters are... 用一般现在时陈述事实；from Terminal 3 表示出发地点。","usage":"对应《领队英语》第一单元 在机场「1.1 在问讯处」，问讯处职员的常用表达。"},{"speaker":"领队","side":"leader","en":"We are a group of 20 people going to Singapore by CA 114.","zh":"我们一行20人乘坐CA114航班前往新加坡。","words":[["a group of","一行/一队"],["20 people","20人"],["Singapore","新加坡"],["by CA 114","乘坐CA114航班"],["begin to check in","开始办理登机"]],"grammar":"a group of + 数字 + people 表达团队规模；by + 航班号 表示乘坐某航班。","usage":"在问讯处向地勤说明团体情况，领队高频开场白。"},{"speaker":"问讯处职员","side":"other","en":"I see. For group check-in, please go to counter D20. A staff member will assist you there.","zh":"明白了。团体值机请到D20柜台，那里有工作人员协助您。","words":[["group check-in","团体值机"],["counter D20","D20柜台"],["assist","协助"]],"grammar":"For group check-in 目的状语前置；please 引导祈使句表礼貌请求；will assist 一般将来时表将提供帮助。","usage":"对应《领队英语》第一单元 在机场「1.1 在问讯处」，问讯处职员的常用表达。"},{"speaker":"领队","side":"leader","en":"Do you know when they begin to check in for our flight?","zh":"你知道我们的航班什么时候开始办理登机吗？","words":[["begin to check in","开始办理登机"],["for our flight","我们的航班"],["do you know","你知道...吗"],["counter","柜台"]],"grammar":"when引导宾语从句，从句用陈述语序；begin to do 开始做某事。","usage":"问讯处常见问题——确认办理登机时间，好安排团队排队。"},{"speaker":"问讯处职员","side":"other","en":"Check-in begins at 2 PM, three hours before departure.","zh":"下午2点开始办理，起飞前三小时。","words":[["three hours before departure","起飞前三小时"]],"grammar":"begins at 2 PM 表具体时刻用介词 at；three hours before departure 名词短语作补充说明。","usage":"对应《领队英语》第一单元 在机场「1.1 在问讯处」，问讯处职员的常用表达。"},{"speaker":"领队","side":"leader","en":"Thank you very much. Let's go, everyone — Terminal 3, counter D20.","zh":"非常感谢。大家走吧——3号航站楼D20柜台。","grammar":"Let's go 祈使句表建议；破折号后 Terminal 3, counter D20 是目的地说明。","usage":"对应《领队英语》第一单元 在机场「1.1 在问讯处」，领队的常用表达。","words":[["thank you very much","非常感谢"],["let's go","我们走吧"],["terminal","航站楼"],["counter","柜台"]]}]},{"id":"d002","unit":"第一单元 在机场","unit_id":1,"name":"1.2 在值机柜台","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Miss, is this the counter for CA 114 to Singapore?","zh":"小姐，这里办理飞往新加坡的CA114航班登机手续吗？","words":[["counter","柜台"],["for CA 114","CA114航班"],["Singapore","新加坡"],["tour leader","领队"]],"grammar":"Is this the counter for... 确认柜台归属的经典句型；for 表\"为...服务\"。","usage":"对应第一单元第1课「At the Check-in Counter（办理值机手续）」，确认柜台是否正确。"},{"speaker":"值机员","side":"other","en":"Yes, this is the right counter. May I see your passports, please?","zh":"是的，就是这个柜台。请把护照给我看一下好吗？","words":[["the right counter","正确的柜台"],["passports","护照（复数）"]],"grammar":"May I see... 比 Can I 更礼貌的请求；the right counter 特指正确的柜台。","usage":"对应《领队英语》第一单元 在机场「1.2 在值机柜台」，值机员的常用表达。"},{"speaker":"领队","side":"leader","en":"Hello, I am Xiao Wang, a tour leader from Yunnan China Youth Travel Service. These are our passports.","zh":"你好，我是小王，来自云南中青旅的领队。这是我们的护照。","words":[["tour leader","领队"],["China Youth Travel Service","中国青年旅行社"],["passports","护照（复数）"],["from Yunnan","来自云南"],["arrange our seats","安排座位"]],"grammar":"a tour leader from... 同位语+from表达，简洁介绍身份和单位；These are... 递材料的标准句式。","usage":"值机柜台正式登场——递护照+表明领队身份。"},{"speaker":"值机员","side":"other","en":"Thank you, Mr. Wang. Twenty passengers for CA 114 — I've found your group booking.","zh":"谢谢，王先生。CA114航班20位乘客——我找到你们的团体预订了。","words":[["group booking","团体预订"],["twenty passengers","20位乘客"]],"grammar":"Twenty passengers for CA 114 名词短语作主语；I've found 现在完成时表已完成；group booking 团体预订。","usage":"对应《领队英语》第一单元 在机场「1.2 在值机柜台」，值机员的常用表达。"},{"speaker":"领队","side":"leader","en":"Is it possible to arrange our seats close to each other, or a family to sit together?","zh":"能不能把我们的座位尽量安排在一起，或者一家人坐一起？","words":[["arrange our seats","安排座位"],["close to each other","互相靠近"],["sit together","坐在一起"],["Is it possible to","是否可能..."],["pieces of luggage","件行李"]],"grammar":"Is it possible to... 礼貌请求；arrange...close to each other 尽量靠近；sit together 一起坐。","usage":"值机时领队为团队争取好座位的标准请求。"},{"speaker":"值机员","side":"other","en":"I'll arrange rows 18 to 23 for your group. Your seats are mostly together. Here are your boarding passes.","zh":"我给贵团安排18到23排，座位基本都在一起。这是登机牌。","words":[["rows 18 to 23","18到23排"],["mostly together","基本在一起"],["boarding passes","登机牌"]],"grammar":"I'll arrange 一般将来时表承诺；rows 18 to 23 用 to 表示范围；mostly together 副词修饰。","usage":"对应《领队英语》第一单元 在机场「1.2 在值机柜台」，值机员的常用表达。"},{"speaker":"领队","side":"leader","en":"Perfect. Thank you for your help!","zh":"太好了，谢谢你的帮助！","grammar":"Perfect 单个形容词作感叹；Thank you for... 为某事感谢的固定搭配。","usage":"对应《领队英语》第一单元 在机场「1.2 在值机柜台」，领队的常用表达。","words":[["perfect","太好了"],["thank you for","为…感谢"],["help","帮助"]]}]},{"id":"d003","unit":"第一单元 在机场","unit_id":1,"name":"1.3 办理行李托运","scene":"在机场","turns":[{"speaker":"值机员","side":"other","en":"Do you have any pieces of luggage to check in?","zh":"您有行李需要托运吗？","words":[["pieces of luggage","件行李"],["check in","托运"],["do you have","您有...吗"],["six pieces","六件"]],"grammar":"luggage 是不可数名词，用 pieces of 量化；to check in 不定式作定语修饰 luggage。","usage":"对应第一单元第1课「Luggage Check-in（行李托运）」，地勤标准问句。"},{"speaker":"领队","side":"leader","en":"Yes, here are six pieces. Please place them on the scales.","zh":"是的，这里有六件。请把它们放在磅秤上。","words":[["six pieces","六件"],["place them on","把它们放在...上"],["scales","磅秤/秤"],["here are","这里有"],["over-sized","超尺寸"]],"grammar":"Here are... 递东西/交代数量的倒装句；place...on... 把...放在...上。","usage":"行李托运办理——报告件数、配合称重。"},{"speaker":"值机员","side":"other","en":"All six pieces are within the weight limit. Here are your baggage claim tags.","zh":"六件都在限重之内。这是行李提取牌。","words":[["within the weight limit","在限重之内"],["baggage claim tags","行李提取牌"]],"grammar":"within the weight limit 在限重之内；baggage claim tags 行李提取牌。","usage":"对应《领队英语》第一单元 在机场「1.3 办理行李托运」，值机员的常用表达。"},{"speaker":"值机员","side":"other","en":"Sorry, this luggage is over-sized. You must go to the over-sized baggage check-in counter.","zh":"抱歉，这件行李超尺寸了。您需要去超规行李托运柜台。","words":[["over-sized","超尺寸"],["over-sized baggage","超规行李"],["check-in counter","托运柜台"],["must go to","需要去"],["transfer to","转乘"]],"grammar":"over- 前缀表\"超过\"（overweight 超重, over-sized 超大）；must 表必须。","usage":"第6版新增内容——自助值机及行李托运场景中的超规行李处理。"},{"speaker":"领队","side":"leader","en":"I see. Where is the over-sized baggage counter, please?","zh":"明白了。请问超规行李柜台在哪里？","grammar":"over-sized 超规的复合形容词；counter 柜台。","usage":"对应《领队英语》第一单元 在机场「1.3 办理行李托运」，领队的常用表达。","words":[["over-sized","超规的"],["baggage","行李"],["counter","柜台"]]},{"speaker":"值机员","side":"other","en":"It's at the end of this aisle, next to counter 30.","zh":"在通道尽头，30号柜台旁边。","words":[["at the end of","在...尽头"],["aisle","通道"]],"grammar":"at the end of this aisle 在通道尽头；next to 紧挨着。","usage":"对应《领队英语》第一单元 在机场「1.3 办理行李托运」，值机员的常用表达。"}]},{"id":"d004","unit":"第一单元 在机场","unit_id":1,"name":"1.4 过境与转机","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Excuse me, we are to transfer to JL 458 to Tokyo. Can you help me?","zh":"劳驾，我们要转乘日本航空公司458号航班去东京，你能帮我吗？","words":[["transfer to","转乘"],["JL 458","日航458航班"],["Tokyo","东京"],["Can you help me","你能帮我吗"],["as close to each other as possible","尽量靠近"]],"grammar":"be to do 表示\"计划/安排要做\"，比 will 更正式；transfer to 转机到。","usage":"对应第一单元第1课「Transit and Transfer（过境与转机）」，转机柜台的标准请求。"},{"speaker":"转机柜台职员","side":"other","en":"Sure. Do you already have your boarding passes for JL 458?","zh":"当然可以。你们已经有JL458的登机牌了吗？","grammar":"Do you already have... 一般疑问句，already 用于疑问句表\"已经\"；boarding passes 登机牌复数。","usage":"对应《领队英语》第一单元 在机场「1.4 过境与转机」，转机柜台职员的常用表达。","words":[["boarding passes","登机牌"],["already","已经"]]},{"speaker":"领队","side":"leader","en":"No, we need to collect them here at the transfer desk.","zh":"没有，我们需要在转机柜台领取。","words":[["collect","领取"],["transfer desk","转机柜台"]],"grammar":"need to collect them 需要领取；here at the transfer desk 地点状语。","usage":"对应《领队英语》第一单元 在机场「1.4 过境与转机」，领队的常用表达。"},{"speaker":"领队","side":"leader","en":"Can we have our seats as close to each other as possible?","zh":"我们的座位能尽量安排在一起吗？","words":[["as close to each other as possible","尽量靠近"],["have our seats","安排我们的座位"],["smoking seats","吸烟区座位"]],"grammar":"as...as possible 结构表\"尽可能...\"；close to each other 互相靠近。","usage":"转机换登机牌时，再次争取团队座位安排在一起。"},{"speaker":"转机柜台职员","side":"other","en":"Of course. How many people are in your group?","zh":"没问题。你们团一共多少人？","grammar":"How many people 询问数量；in your group 后置定语修饰 people。","usage":"对应《领队英语》第一单元 在机场「1.4 过境与转机」，转机柜台职员的常用表达。","words":[["how many","多少"],["group","团队"]]},{"speaker":"领队","side":"leader","en":"We need three smoking seats and seven non-smoking seats.","zh":"我们需要三个吸烟座位和七个非吸烟座位。","words":[["smoking seats","吸烟区座位"],["non-smoking seats","非吸烟区座位"],["we need","我们需要"],["boarding Gate 28","28号登机口"]],"grammar":"non- 否定前缀；seats 座位（countable）。注意：现在大多数航班已全面禁烟，此为教材历史内容。","usage":"转机时确认座位偏好分布。"},{"speaker":"转机柜台职员","side":"other","en":"All right. Rows 25 and 26, mostly together. Here are your passes for JL 458.","zh":"好的。25和26排，基本都在一起。这是JL458的登机牌。","grammar":"All right 好的；mostly together 基本在一起；Here are... 倒装句表\"这是…\"。","usage":"对应《领队英语》第一单元 在机场「1.4 过境与转机」，转机柜台职员的常用表达。","words":[["rows","排"],["mostly","主要地"],["together","一起"]]}]},{"id":"d005","unit":"第一单元 在机场","unit_id":1,"name":"1.5 登机","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Could you tell me the way to boarding Gate 28?","zh":"你能告诉我怎么去28号登机口吗？","words":[["boarding Gate 28","28号登机口"],["the way to","去...的路"],["Could you tell me","你能告诉我吗"],["now boarding","正在登机"]],"grammar":"Could you tell me the way to... 问路的经典句式；boarding gate 登机口。","usage":"对应第一单元第1课「Getting Aboard a Plane（登机）」，确认登机口位置。"},{"speaker":"机场职员","side":"other","en":"Go straight along this corridor and turn left at the duty-free shop. It's about a five-minute walk.","zh":"沿这条通道直走，在免税店左转，步行大约五分钟。","words":[["corridor","通道"],["duty-free shop","免税店"],["turn left","左转"]],"grammar":"Go straight 祈使句；turn left 左转；a five-minute walk 复合形容词（连字符连接）表时间。","usage":"对应《领队英语》第一单元 在机场「1.5 登机」，机场职员的常用表达。"},{"speaker":"领队","side":"leader","en":"The flight is now boarding at Gate 28. Please have your boarding pass ready.","zh":"航班现在在28号登机口登机中。请准备好登机牌。","words":[["now boarding","正在登机"],["boarding pass","登机牌"],["have...ready","把...准备好"],["at Gate 28","在28号口"],["Attention please","请注意"]],"grammar":"is boarding 现在进行时表动作进行中；have sth ready 把某物准备好。","usage":"领队向团员转达登机信息的标准口令。"},{"speaker":"团员","side":"other","en":"Got it. Let's go!","zh":"明白，走吧！","grammar":"Got it 口语\"明白了\"；Let's go 祈使句。","usage":"对应《领队英语》第一单元 在机场「1.5 登机」，团员的常用表达。","words":[["got it","明白了"],["let's go","走吧"]]},{"speaker":"登机口地勤","side":"other","en":"Boarding pass and passport, please. Enjoy your flight!","zh":"请出示登机牌和护照。祝您旅途愉快！","words":[["Enjoy your flight","祝您旅途愉快"]],"grammar":"Boarding pass and passport, please 省略句（省略 Show me）；Enjoy your flight 祈使句祝福语。","usage":"对应《领队英语》第一单元 在机场「1.5 登机」，登机口地勤的常用表达。"}]},{"id":"d006","unit":"第一单元 在机场","unit_id":1,"name":"1.6 机场广播","scene":"在机场","turns":[{"speaker":"机场广播","side":"other","en":"Attention please. Flight CA 112 to Seoul is now ready for boarding at Gate 15.","zh":"请注意。前往首尔的CA112航班现在在15号口开始登机。","words":[["Attention please","请注意"],["Flight CA 112","CA112航班"],["ready for boarding","准备登机"],["at Gate 15","在15号口"],["final boarding call","最后一次登机通知"]],"grammar":"ready for... 准备好...；boarding 登机（动名词）；这是标准的机场广播句式。","usage":"对应第一单元第1课「Airport Announcements（机场广播）」，领队需帮团员听懂英文广播。"},{"speaker":"领队","side":"leader","en":"Did you hear that, everyone? Our flight CA 112 is boarding at Gate 15. Please follow me.","zh":"大家听到了吗？我们的CA112航班在15号口登机了，请跟我来。","words":[["follow me","跟我来"]],"grammar":"Did you hear that... 一般过去时疑问句；is boarding 现在进行时表正在登机；Please follow me 祈使句。","usage":"对应《领队英语》第一单元 在机场「1.6 机场广播」，领队的常用表达。"},{"speaker":"机场广播","side":"other","en":"This is the final boarding call for passengers on flight MU 362 to Shanghai.","zh":"这是前往上海的MU362航班的最后一次登机通知。","words":[["final boarding call","最后一次登机通知"],["passengers","乘客"],["MU 362","MU362航班"],["to Shanghai","前往上海"],["disembarkation cards","入境卡"]],"grammar":"final call 最后召集；on flight... 乘坐...航班；passengers on flight 航班乘客。","usage":"领队必须听懂的最后登机广播——错过就麻烦了。"},{"speaker":"团员","side":"other","en":"Is that our flight? It sounds urgent.","zh":"那是我们的航班吗？听起来很急。","words":[["urgent","紧急的"]],"grammar":"Is that our flight 一般疑问句；sounds urgent 系动词+形容词，sounds 听起来。","usage":"对应《领队英语》第一单元 在机场「1.6 机场广播」，团员的常用表达。"},{"speaker":"领队","side":"leader","en":"No, that's MU 362 to Shanghai. Ours is CA 112 to Seoul. Don't worry.","zh":"不是，那是去上海的MU362。我们是去首尔的CA112，别担心。","grammar":"that's MU 362 to Shanghai 到某地的航班用 to；Don't worry 否定祈使句。","usage":"对应《领队英语》第一单元 在机场「1.6 机场广播」，领队的常用表达。","words":[["to Shanghai","去上海"],["ours","我们的"],["worry","担心"]]}]},{"id":"d007","unit":"第一单元 在机场","unit_id":1,"name":"2.1 办理入境手续","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Please have your passports and disembarkation cards ready for immigration inspection.","zh":"请准备好护照和入境卡，以备入境检查。","words":[["disembarkation cards","入境卡"],["immigration inspection","入境检查"],["have...ready","把...准备好"],["passports","护照"],["the purpose of your visit","来访目的"]],"grammar":"have sth ready for... 为...准备好某物；disembarkation 下飞机→入境。","usage":"对应第一单元第2课「Immigration Formalities（办理入境手续）」，入境检查前的标准提醒。"},{"speaker":"团员","side":"other","en":"What will the officer ask us?","zh":"入境官会问我们什么？","grammar":"What will the officer ask us 将来时特殊疑问句；the officer 特指入境官。","usage":"对应《领队英语》第一单元 在机场「2.1 办理入境手续」，团员的常用表达。","words":[["officer","官员"],["ask","询问"]]},{"speaker":"领队","side":"leader","en":"The officer will ask you about the purpose of your visit. Just say 'tourism' or 'sightseeing'.","zh":"官员会问你来访目的，就说'tourism'（旅游）或'sightseeing'（观光）。","words":[["the purpose of your visit","来访目的"],["tourism","旅游"],["sightseeing","观光"],["officer","官员"],["baggage claim area","行李提取区"]],"grammar":"the purpose of 的固定搭配；will ask 将来时表预判；Just say... 简洁指令。","usage":"领队提前给团员做入境辅导，避免过关时紧张。"},{"speaker":"团员","side":"other","en":"OK, got it. 'Tourism'. Anything else we should prepare?","zh":"好的记住了，tourism。还要准备别的吗？","grammar":"got it 明白了；Anything else... 省略句，完整形式是 Is there anything else。","usage":"对应《领队英语》第一单元 在机场「2.1 办理入境手续」，团员的常用表达。","words":[["tourism","旅游"],["anything else","别的什么"],["prepare","准备"]]},{"speaker":"领队","side":"leader","en":"Also keep your hotel address handy. They sometimes ask where you will stay.","zh":"还要把酒店地址准备好，他们有时会问住在哪里。","words":[["keep...handy","把...备好"],["hotel address","酒店地址"]],"grammar":"keep...handy 使…随手可得；where you will stay 宾语从句用陈述语序。","usage":"对应《领队英语》第一单元 在机场「2.1 办理入境手续」，领队的常用表达。"},{"speaker":"入境官","side":"other","en":"Next, please. Passport and arrival card... What's the purpose of your visit?","zh":"下一位。护照和入境卡……来访目的是什么？","words":[["arrival card","入境卡"],["purpose of your visit","来访目的"]],"grammar":"Next, please 省略句；What's the purpose of your visit 询问来访目的的标准问句。","usage":"对应《领队英语》第一单元 在机场「2.1 办理入境手续」，入境官的常用表达。"},{"speaker":"团员","side":"other","en":"Tourism.","zh":"旅游。","grammar":"Tourism 单个名词作答，口语省略句。","usage":"对应《领队英语》第一单元 在机场「2.1 办理入境手续」，团员的常用表达。","words":[["tourism","旅游"]]}]},{"id":"d008","unit":"第一单元 在机场","unit_id":1,"name":"2.2 提取行李","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"The baggage claim area is over there. Our flight's luggage will be on Carousel No.5.","zh":"行李提取处就在那边。我们航班的行李将在5号转盘。","words":[["baggage claim area","行李提取区"],["Carousel No.5","5号转盘"],["over there","在那边"],["luggage","行李"],["double-check","再次核对"]],"grammar":"baggage claim 行李领取；carousel 行李传送带/转盘；will be on 将在...上。","usage":"对应第一单元第2课「Luggage Claiming（提取行李）」，引导团员找行李。"},{"speaker":"团员","side":"other","en":"How do we know which carousel is ours?","zh":"我们怎么知道哪个转盘是我们的？","grammar":"which carousel is ours 宾语从句用陈述语序；ours 名词性物主代词。","usage":"对应《领队英语》第一单元 在机场「2.2 提取行李」，团员的常用表达。","words":[["carousel","行李转盘"],["know","知道"],["ours","我们的"]]},{"speaker":"领队","side":"leader","en":"Check the screen above each carousel — it shows the flight number.","zh":"看每个转盘上方的屏幕，会显示航班号。","words":[["screen","屏幕"],["carousel","行李转盘"],["flight number","航班号"]],"grammar":"Check the screen above each carousel 祈使句；above 在…上方；it shows 它显示。","usage":"对应《领队英语》第一单元 在机场「2.2 提取行李」，领队的常用表达。"},{"speaker":"领队","side":"leader","en":"Please double-check your luggage tags before you leave the claim area.","zh":"离开领取区前请再次核对行李牌。","words":[["double-check","再次核对"],["luggage tags","行李牌"],["claim area","领取区"],["before you leave","在你离开前"],["stay behind","站在...后面"]],"grammar":"double-check 再次确认；before引导时间状语从句；luggage tag 行李牌。","usage":"防止拿错行李的提醒——领队安全须知。"},{"speaker":"团员","side":"other","en":"OK, mine matches. Tag number 318527.","zh":"好的，我的对上了，行李牌号318527。","words":[["match","对得上/匹配"]],"grammar":"mine matches 名词性物主代词作主语；matches 相符。","usage":"对应《领队英语》第一单元 在机场「2.2 提取行李」，团员的常用表达。"}]},{"id":"d009","unit":"第一单元 在机场","unit_id":1,"name":"2.3 通过海关","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Please stay behind the yellow line and wait for your turn at the customs counter.","zh":"请在黄线后等候，排队等待海关检查。","words":[["stay behind","站在...后面"],["yellow line","黄线"],["wait for your turn","等待轮到您"],["customs counter","海关柜台"],["carrying","携带"]],"grammar":"stay behind 站/待在...后；wait for one's turn 排队等待；at the customs counter 在海关柜台。","usage":"对应第一单元第2课「Customs Clearance（通过海关）」，维持团队秩序。"},{"speaker":"海关官员","side":"other","en":"Next, please. Passport and customs declaration form.","zh":"下一位。请出示护照和海关申报单。","words":[["customs declaration form","海关申报单"]],"grammar":"Passport and customs declaration form 省略句；declaration form 申报单。","usage":"对应《领队英语》第一单元 在机场「2.3 通过海关」，海关官员的常用表达。"},{"speaker":"领队","side":"leader","en":"If you're carrying more than 10,000 US dollars in cash or equivalents, you must declare it.","zh":"如携带超过一万美元现金或等值货币，必须申报。","words":[["carrying","携带"],["in cash","以现金形式"],["declare","申报"],["equivalents","等值物"],["carry-on bags","随身行李"]],"grammar":"if引导条件从句；in cash 以现金形式；must declare 强制申报；equivalents 等值。","usage":"海关申报提醒——避免团员被罚款的关键提醒。"},{"speaker":"团员","side":"other","en":"I only carry about 2,000 dollars. I don't need to declare, right?","zh":"我只带了大约2000美元，不用申报吧？","words":[["declare","申报"]],"grammar":"only carry about 2,000 dollars 大概数用 about；don't need to declare 不需要申报。","usage":"对应《领队英语》第一单元 在机场「2.3 通过海关」，团员的常用表达。"},{"speaker":"领队","side":"leader","en":"That's right. Take the green channel — nothing to declare.","zh":"对。走绿色通道——无申报通道。","words":[["green channel","绿色通道"],["nothing to declare","无申报"]],"grammar":"Take the green channel 祈使句；nothing to declare 不定式作后置定语。","usage":"对应《领队英语》第一单元 在机场「2.3 通过海关」，领队的常用表达。"}]},{"id":"d010","unit":"第一单元 在机场","unit_id":1,"name":"2.4 行李安检","scene":"在机场","turns":[{"speaker":"安检员","side":"other","en":"Please put your carry-on bags on the conveyor belt for X-ray screening.","zh":"请将随身行李放在传送带上进行X光检查。","words":[["carry-on bags","随身行李"],["conveyor belt","传送带"],["X-ray screening","X光检查"],["put...on","把...放在...上"],["take out","取出"]],"grammar":"carry-on 随身携带的（形容词兼名词）；screening 检查/筛查；put on 放在...上。","usage":"对应第一单元第2课「Security Check（行李安检）」，第6版新增了金属物件及饮用水处理内容。"},{"speaker":"领队","side":"leader","en":"Please take out your laptop, power bank, and any metal items from your bag and place them in the tray.","zh":"请从包中取出笔记本电脑、充电宝和所有金属物品放入托盘。","words":[["take out","取出"],["power bank","充电宝"],["metal items","金属物品"],["tray","托盘"],["liquids","液体"]],"grammar":"take out...from... 从...取出...；and place them 并列祈使句；tray 安检托盘。","usage":"第6版新增安检细则——电子产品及金属物件单独过检。"},{"speaker":"团员","side":"other","en":"What about my water bottle? Can I take it through?","zh":"我的水杯呢？能带过去吗？","words":[["water bottle","水杯"],["take it through","带过去"]],"grammar":"What about... 询问…怎么样；take it through 带过去。","usage":"对应《领队英语》第一单元 在机场「2.4 行李安检」，团员的常用表达。"},{"speaker":"安检员","side":"other","en":"Any liquids over 100ml are not allowed in carry-on luggage. Please drink it or dispose of it now.","zh":"随身行李中不允许携带超过100毫升的液体。请现在喝掉或处理掉。","words":[["liquids","液体"],["over 100ml","超过100毫升"],["carry-on luggage","随身行李"],["dispose of","处理掉"],["emigration counter","出境柜台"]],"grammar":"are not allowed 不被允许；over 100ml 超过100毫升；dispose of 处理/处置。","usage":"第6版新增——饮用水等液体安检规定提醒。"},{"speaker":"团员","side":"other","en":"OK, I'll finish it now.","zh":"好的，我现在喝完。","grammar":"I'll finish it now 将来时；finish 完成、用完。","usage":"对应《领队英语》第一单元 在机场「2.4 行李安检」，团员的常用表达。","words":[["finish","用完、喝完"],["now","现在"]]}]},{"id":"d011","unit":"第一单元 在机场","unit_id":1,"name":"2.5 办理出境手续","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Please go to the emigration counter with your passport and boarding pass.","zh":"请持护照和登机牌前往出境检查柜台。","words":[["emigration counter","出境柜台"],["boarding pass","登机牌"],["go to","前往"],["passport","护照"],["departure card","出境卡"]],"grammar":"emigration 出境（← e- 向外 + migration 迁移），与 immigration（入境）对应；go to...with... 带...去...。","usage":"对应第一单元第2课「Emigration Formalities（办理出境手续）」，离境标准流程。"},{"speaker":"团员","side":"other","en":"Do we need to fill out any forms first?","zh":"需要先填什么表格吗？","words":[["fill out","填写"]],"grammar":"need to fill out 需要填写；fill out 填写表格。","usage":"对应《领队英语》第一单元 在机场「2.5 办理出境手续」，团员的常用表达。"},{"speaker":"领队","side":"leader","en":"Make sure your departure card has been filled out correctly before you reach the counter.","zh":"确保出境卡在到达柜台前正确填写完毕。","words":[["departure card","出境卡"],["filled out","填写"],["correctly","正确"],["make sure","确保"],["tax refund form","退税单"]],"grammar":"make sure + 从句 确保...；has been filled out 现在完成时被动；departure 出发/出境。","usage":"离境前最后检查——出境卡是否填对。"},{"speaker":"边检官","side":"other","en":"Passport, boarding pass and departure card, please... Thank you. You're all set.","zh":"护照、登机牌和出境卡……谢谢，都办好了。","words":[["departure card","出境卡"],["You're all set","都办好了"]],"grammar":"Passport, boarding pass and departure card, please 列举省略句；You're all set 口语\"都办好了\"。","usage":"对应《领队英语》第一单元 在机场「2.5 办理出境手续」，边检官的常用表达。"}]},{"id":"d012","unit":"第一单元 在机场","unit_id":1,"name":"2.6 办理退税手续","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Where can I get the tax refund form? We need it for our group purchases.","zh":"在哪里领取退税单？我们团购商品需要办理。","words":[["tax refund form","退税单"],["group purchases","团购商品"],["where can I get","哪里能拿到"],["claim a tax refund","申请退税"]],"grammar":"tax refund 退税（refund = re回 + fund资金）；Where can I get... 询问获取地点。","usage":"对应第一单元第2课「Tax Refund（办理退税手续）」，退税第一步——拿表。"},{"speaker":"店员","side":"other","en":"I'll prepare the refund forms for you. May I see your passports and receipts?","zh":"我来为您准备退税单。请给我看一下护照和收据。","words":[["refund forms","退税单"],["receipts","收据"]],"grammar":"prepare the refund forms 准备退税单；May I see 礼貌请求。","usage":"对应《领队英语》第一单元 在机场「2.6 办理退税手续」，店员的常用表达。"},{"speaker":"店员","side":"other","en":"You can claim a tax refund on purchases over 5,000 yen. Please show your passport and receipts at the counter.","zh":"购物满5000日元可申请退税，请在柜台出示护照和收据。","words":[["claim a tax refund","申请退税"],["purchases over","购物满...以上"],["receipts","收据"],["at the counter","在柜台"],["has been delayed","已被延误"]],"grammar":"claim 申请/领取；on purchases over... 在满...的消费上；receipts 收据（注意p不发音 re-seets）。","usage":"向团员解释退税门槛和流程。"},{"speaker":"领队","side":"leader","en":"Everyone, remember: keep your receipts! We'll do the refund together at the airport counter.","zh":"大家记住：收好收据！我们到机场退税柜台一起办理。","words":[["keep your receipts","收好收据"]],"grammar":"keep your receipts 收好收据；do the refund 办理退税。","usage":"对应《领队英语》第一单元 在机场「2.6 办理退税手续」，领队的常用表达。"},{"speaker":"团员","side":"other","en":"Where is the refund counter at the airport?","zh":"机场的退税柜台在哪里？","grammar":"Where is the refund counter 询问位置。","usage":"对应《领队英语》第一单元 在机场「2.6 办理退税手续」，团员的常用表达。","words":[["refund","退税"],["counter","柜台"],["airport","机场"]]},{"speaker":"领队","side":"leader","en":"After security, near Gate 30. I'll take you all there.","zh":"过了安检，30号登机口附近。到时候我带大家去。","words":[["after security","安检之后"]],"grammar":"After security 过了安检；near Gate 30 在30号口附近。","usage":"对应《领队英语》第一单元 在机场「2.6 办理退税手续」，领队的常用表达。"}]},{"id":"d013","unit":"第一单元 在机场","unit_id":1,"name":"3.1 航班延误","scene":"在机场","turns":[{"speaker":"领队","side":"leader","en":"Attention everyone. Our flight CA 114 has been delayed due to bad weather conditions.","zh":"各位请注意，我们的CA114航班因恶劣天气延误了。","words":[["has been delayed","已被延误"],["due to","由于"],["bad weather conditions","恶劣天气"],["attention everyone","各位请注意"],["provide us with","为我们提供"]],"grammar":"has been delayed 现在完成时被动，表\"已被延误\"；due to + 名词 表原因。","usage":"对应第一单元第3课「Flight Is Delayed（航班延误）」，领队需第一时间通知团员并安抚。"},{"speaker":"团员","side":"other","en":"How long will we have to wait?","zh":"我们要等多久？","grammar":"How long will we have to wait 将来时疑问句，have to 不得不。","usage":"对应《领队英语》第一单元 在机场「3.1 航班延误」，团员的常用表达。","words":[["how long","多久"],["wait","等待"]]},{"speaker":"领队","side":"leader","en":"The new departure time is 5:30 PM. Please gather at Gate 12 by 4:30 PM.","zh":"新的出发时间是下午五点半。请于下午四点半在12号口集合。","words":[["departure time","出发时间"],["gather at","在...集合"],["by 4:30 PM","在下午四点半之前"],["Gate 12","12号口"],["I've lost","我丢了"]],"grammar":"departure 出发（← depart）；gather 集合；by + 时间 表\"在...之前\"。","usage":"延误后重新安排集合——给团员明确的时间地点。"},{"speaker":"团员","side":"other","en":"What about dinner? It's a long wait.","zh":"晚饭怎么办？要等这么久。","words":[["a long wait","等很久"]],"grammar":"What about dinner 询问晚饭怎么办；It's a long wait 主系表结构。","usage":"对应《领队英语》第一单元 在机场「3.1 航班延误」，团员的常用表达。"},{"speaker":"领队","side":"leader","en":"The airline will provide us with free meals and accommodation. Please keep your boarding pass as a meal voucher.","zh":"航空公司将提供免费餐食和住宿，请保留登机牌作为餐券。","words":[["provide us with","为我们提供"],["accommodation","住宿"],["meal voucher","餐券"],["keep...as","保留...作为"],["departure time","出发时间"]],"grammar":"provide sb with sth 为某人提供某物；as 作为；voucher 凭证/券。","usage":"延误后领队争取权益——告知团员航空公司的补偿措施。"},{"speaker":"团员","side":"other","en":"OK, understood. See you at 4:30 at Gate 12.","zh":"好的，明白。4点半12号口见。","grammar":"understood 明白；See you at 4:30 告别用语。","usage":"对应《领队英语》第一单元 在机场「3.1 航班延误」，团员的常用表达。","words":[["understood","明白"],["see you","再见"]]}]},{"id":"d014","unit":"第一单元 在机场","unit_id":1,"name":"3.2 登机牌丢失","scene":"在机场","turns":[{"speaker":"团员","side":"other","en":"I've lost my boarding pass! What should I do?","zh":"我的登机牌丢了！我该怎么办？","words":[["I've lost","我丢了"],["boarding pass","登机牌"],["What should I do","我该怎么办"],["Don't worry","别担心"]],"grammar":"I've lost = I have lost 现在完成时；should 表建议。","usage":"对应第一单元第3课「Boarding Pass Is Lost（登机牌丢失）」，模拟团员紧急求助场景。"},{"speaker":"领队","side":"leader","en":"Don't worry. Go back to the check-in counter with your passport and they will reissue one for you.","zh":"别担心。带着护照返回值机柜台，他们会给你补办一张。","words":[["Don't worry","别担心"],["go back to","返回"],["reissue","补发/重新发"],["check-in counter","值机柜台"],["one piece of luggage","一件行李"]],"grammar":"Don't worry 安抚用语；reissue = re 重新 + issue 签发；will reissue 将来时。","usage":"领队应对登机牌丢失的标准处理流程。"},{"speaker":"团员","side":"other","en":"Will it take long? Boarding starts in 30 minutes.","zh":"要很久吗？30分钟后就开始登机了。","grammar":"Will it take long 疑问句；Boarding starts in 30 minutes 一般现在时表按计划发生。","usage":"对应《领队英语》第一单元 在机场「3.2 登机牌丢失」，团员的常用表达。","words":[["take long","花很久"],["boarding","登机"]]},{"speaker":"领队","side":"leader","en":"It only takes a few minutes. I'll go with you.","zh":"只要几分钟，我陪你一起去。","grammar":"It only takes a few minutes take 花费时间；I'll go with you 我陪你去。","usage":"对应《领队英语》第一单元 在机场「3.2 登机牌丢失」，领队的常用表达。","words":[["takes a few minutes","几分钟"],["go with","陪同"]]},{"speaker":"值机员","side":"other","en":"May I see your passport? ... Here is your new boarding pass. Have a nice flight.","zh":"请出示护照……这是您的新登机牌，旅途愉快。","words":[["reissue","补办"],["new boarding pass","新登机牌"]],"grammar":"May I see your passport 礼貌请求；Here is your new boarding pass 倒装句；Have a nice flight 祝福语。","usage":"对应《领队英语》第一单元 在机场「3.2 登机牌丢失」，值机员的常用表达。"},{"speaker":"团员","side":"other","en":"Thank you so much!","zh":"太感谢了！","grammar":"Thank you so much 非常感谢。","usage":"对应《领队英语》第一单元 在机场「3.2 登机牌丢失」，团员的常用表达。","words":[["thank you so much","非常感谢"]]}]},{"id":"d015","unit":"第一单元 在机场","unit_id":1,"name":"3.3 行李件数短缺","scene":"在机场","turns":[{"speaker":"团员","side":"other","en":"One piece of my luggage is missing. It didn't come out on the carousel.","zh":"我有一件行李不见了，没在转盘上出来。","words":[["one piece of luggage","一件行李"],["missing","不见了"],["carousel","转盘"],["didn't come out","没有出来"],["Lost and Found","失物招领"]],"grammar":"is missing 现在进行时表状态\"不见了\"；come out 出来（行李从传送带出来）。","usage":"对应第一单元第3课「Luggage Is Missing（行李件数短缺）」，提取行李时的常见问题。"},{"speaker":"领队","side":"leader","en":"Let's go to the Lost and Found counter. I'll help you fill out the Property Irregularity Report.","zh":"我们去行李查询柜台，我帮你填行李异常报告单。","words":[["Lost and Found","失物招领"],["fill out","填写"],["Property Irregularity Report","行李异常报告"],["has been sent to","被送往"]],"grammar":"Lost and Found 失物招领处；irregularity 异常（ir不+regular常规+ity名词）；Property 此处指行李。","usage":"领队处理行李丢失的标准流程——填PIR报告是追回行李的关键步骤。"},{"speaker":"行李查询处职员","side":"other","en":"Can you describe your luggage? Color, size and brand, please.","zh":"请描述一下您的行李：颜色、尺寸和品牌。","words":[["describe","描述"],["brand","品牌"]],"grammar":"Can you describe... 请求描述；Color, size and brand, please 列举。","usage":"对应《领队英语》第一单元 在机场「3.3 行李件数短缺」，行李查询处职员的常用表达。"},{"speaker":"团员","side":"other","en":"It's a black 26-inch suitcase with a red ribbon on the handle.","zh":"黑色26寸行李箱，把手上系着红丝带。","words":[["suitcase","行李箱"],["ribbon","丝带"],["handle","把手"]],"grammar":"a black 26-inch suitcase 复合定语（颜色+尺寸）；with a red ribbon 伴随状语。","usage":"对应《领队英语》第一单元 在机场「3.3 行李件数短缺」，团员的常用表达。"},{"speaker":"行李查询处职员","side":"other","en":"We will contact your hotel as soon as we find it. Here is your copy of the report.","zh":"找到后我们会立即联系您的酒店。这是报告单副本。","words":[["contact","联系"],["copy of the report","报告单副本"]],"grammar":"as soon as we find it 时间状语从句；Here is your copy 倒装句。","usage":"对应《领队英语》第一单元 在机场「3.3 行李件数短缺」，行李查询处职员的常用表达。"}]},{"id":"d016","unit":"第一单元 在机场","unit_id":1,"name":"3.4 行李错挂航班","scene":"在机场","turns":[{"speaker":"团员","side":"other","en":"My luggage has been sent to the wrong flight. It was tagged for Tokyo but I'm in Singapore.","zh":"我的行李被错挂到了别的航班上。行李牌上是东京，但我在新加坡。","words":[["has been sent to","被送往"],["wrong flight","错误航班"],["tagged for","标签显示"],["Tokyo","东京"],["trace","追踪"]],"grammar":"has been sent 现在完成时被动；tag 作动词\"贴标签\"；tagged for 被标注为去往...。","usage":"对应第一单元第3课「Luggage Is Misplaced（行李错挂航班）」，比行李件数短缺更严重——错运到别的目的地。"},{"speaker":"行李查询处职员","side":"other","en":"The airline will trace your luggage and deliver it to your hotel within 24 hours. Here's the reference number.","zh":"航空公司会追踪你的行李并在24小时内送到你的酒店。这是查询编号。","words":[["trace","追踪"],["deliver","送达"],["reference number","查询编号"],["within 24 hours","在24小时内"]],"grammar":"will trace and deliver 将来时并列谓语；within + 时间 在...内；reference number 追踪/查询号。","usage":"行李错挂后的善后方案——给团员一个明确的时间预期和追踪方式。"},{"speaker":"团员","side":"other","en":"What if I need my things tonight?","zh":"我今晚要用行李里的东西怎么办？","grammar":"What if... 如果…怎么办；tonight 今晚。","usage":"对应《领队英语》第一单元 在机场「3.4 行李错挂航班」，团员的常用表达。","words":[["what if","如果…怎么办"],["things","东西"],["tonight","今晚"]]},{"speaker":"领队","side":"leader","en":"Keep this reference number safe. I'll call the airline first thing tomorrow morning.","zh":"收好这个查询编号。我明早一早就给航空公司打电话。","words":[["reference number","查询编号"],["first thing in the morning","一早就办"]],"grammar":"Keep...safe 保持安全；reference number 查询编号；first thing tomorrow morning 明早第一件事。","usage":"对应《领队英语》第一单元 在机场「3.4 行李错挂航班」，领队的常用表达。"}]},{"id":"d017","unit":"第二单元 在飞机上","unit_id":2,"name":"第1课 机上餐饮","scene":"在飞机上","turns":[{"speaker":"空乘","side":"other","en":"What would you like to eat, Chinese food or Western food?","zh":"您要吃什么，中餐还是西餐？","words":[["What would you like","您想要什么"],["Chinese food","中餐"],["Western food","西餐"],["eat","吃"],["chicken with rice","鸡肉饭"]],"grammar":"What would you like to... 礼貌询问；or 表选择。","usage":"对应《领队英语》第二单元第1课「机上餐饮」，领队帮团员翻译点餐选项。"},{"speaker":"游客","side":"other","en":"I'd like chicken with rice, please. And a cup of orange juice.","zh":"我要鸡肉饭，再来一杯橙汁。","words":[["chicken with rice","鸡肉饭"],["a cup of","一杯"],["orange juice","橙汁"],["I'd like","我想要"],["some more","再来一些"]],"grammar":"I'd like = I would like 礼貌表达需求；with 搭配/配以。","usage":"领队帮团员选择餐食和饮品——鸡肉饭是长途航班常见选项。"},{"speaker":"空乘","side":"other","en":"Here you are. Enjoy your meal.","zh":"给您，请慢用。","words":[["Enjoy your meal","请慢用"]],"grammar":"Here you are 给你；Enjoy your meal 请慢用。","usage":"对应《领队英语》第二单元 在飞机上「第1课 机上餐饮」，空乘的常用表达。"},{"speaker":"空乘","side":"other","en":"Would you like anything to drink? We have sodas, juices, beer and wine.","zh":"要喝点什么吗？我们有汽水、果汁、啤酒和葡萄酒。","words":[["anything to drink","喝的东西"],["sodas","汽水"],["beer","啤酒"],["wine","葡萄酒"],["feeling airsick","感到晕机"]],"grammar":"anything to drink 不定式作定语修饰不定代词；Would you like... 礼貌提供。","usage":"机上饮料服务标准问句，领队可帮不懂英语的团员翻译选项。"},{"speaker":"游客","side":"other","en":"Could I have some more coffee, please?","zh":"能再给我来点咖啡吗？","words":[["some more","再来一些"],["coffee","咖啡"],["Could I have","我能要...吗"],["anything to drink","喝的东西"]],"grammar":"Could I have... 礼貌请求；some more 再来一些（more表额外的）。","usage":"要求续杯，对应第一课餐饮服务拓展内容。"},{"speaker":"空乘","side":"other","en":"Certainly. With milk or sugar?","zh":"好的。要加奶或糖吗？","words":[["milk or sugar","奶或糖"]],"grammar":"Certainly 当然；With milk or sugar 加奶还是糖。","usage":"对应《领队英语》第二单元 在飞机上「第1课 机上餐饮」，空乘的常用表达。"}]},{"id":"d018","unit":"第二单元 在飞机上","unit_id":2,"name":"第2课 照顾不适游客","scene":"在飞机上","turns":[{"speaker":"领队","side":"leader","en":"Are you feeling airsick? Would you like some medicine?","zh":"你晕机吗？要不要吃点药？","words":[["feeling airsick","感到晕机"],["medicine","药"],["would you like","你想要吗"],["flight attendant","乘务员"]],"grammar":"feel + 形容词（airsick）表\"感觉...\"；airsick 晕机（仿 seasick 晕船, carsick 晕车）。","usage":"对应《领队英语》第二单元第2课「照顾不适游客」，领队主动关心身体不适团员。"},{"speaker":"游客","side":"other","en":"Yes, I feel dizzy and a little nauseous.","zh":"是的，我头晕，还有点恶心。","words":[["dizzy","头晕的"],["nauseous","恶心的"]],"grammar":"feel dizzy and a little nauseous 系动词 feel+形容词；a little 一点。","usage":"对应《领队英语》第二单元 在飞机上「第2课 照顾不适游客」，游客的常用表达。"},{"speaker":"领队","side":"leader","en":"I'll ask the flight attendant for an airsickness bag and some medicine.","zh":"我帮你向乘务员要一个呕吐袋和一些药。","words":[["flight attendant","乘务员"],["airsickness bag","呕吐袋"],["I'll ask for","我会要..."],["deep breaths","深呼吸"]],"grammar":"I'll ask sb for sth 我帮某人要某物；airsickness 晕机（名词）；bag 袋。","usage":"领队代表团员向乘务员求助——标准服务流程。"},{"speaker":"游客","side":"other","en":"Thank you. That's very kind of you.","zh":"谢谢，太麻烦你了。","grammar":"That's very kind of you 客套话\"你真好\"。","usage":"对应《领队英语》第二单元 在飞机上「第2课 照顾不适游客」，游客的常用表达。","words":[["kind","好心的"]]},{"speaker":"领队","side":"leader","en":"Try to take deep breaths and keep your head still. The seat pocket has an airsickness bag.","zh":"试着深呼吸，头不要动。座椅口袋里有个呕吐袋。","words":[["deep breaths","深呼吸"],["keep your head still","头不动"],["seat pocket","座椅口袋"],["airsickness bag","呕吐袋"],["a blanket","一条毯子"]],"grammar":"take deep breaths 深呼吸；keep + 宾语 + still 使...保持不动；seat pocket 座椅背后的口袋。","usage":"安抚晕机团员的实操技巧，体现领队的专业和经验。"},{"speaker":"游客","side":"other","en":"OK... I feel a little better now. Thanks.","zh":"好的……现在感觉好些了，谢谢。","grammar":"feel a little better 系动词+比较级。","usage":"对应《领队英语》第二单元 在飞机上「第2课 照顾不适游客」，游客的常用表达。","words":[["feel better","感觉好些"],["a little","一点"]]}]},{"id":"d019","unit":"第二单元 在飞机上","unit_id":2,"name":"第3课 要求机上服务","scene":"在飞机上","turns":[{"speaker":"游客","side":"other","en":"Excuse me, could I have a blanket, please? It's a bit cold.","zh":"打扰一下，能给我一条毯子吗？有点冷。","words":[["a blanket","一条毯子"],["a bit cold","有点冷"],["Excuse me","打扰一下"],["earphones","耳机"]],"grammar":"Could I have... please? 礼貌请求物品；a bit + 形容词 表\"有点...\"；blanket 机上常用物品。","usage":"对应《领队英语》第二单元第3课「要求机上服务」，要毯子是最高频的机上请求之一。"},{"speaker":"空乘","side":"other","en":"Certainly. Here is a blanket for you.","zh":"好的，给您毯子。","words":[["blanket","毯子"]],"grammar":"Here is a blanket for you 倒装句。","usage":"对应《领队英语》第二单元 在飞机上「第3课 要求机上服务」，空乘的常用表达。"},{"speaker":"游客","side":"other","en":"These earphones don't seem to be working. Could you bring me a new pair?","zh":"这副耳机好像坏了，能给我换副新的吗？","words":[["earphones","耳机"],["don't seem to be working","好像坏了"],["a new pair","一副新的"],["duty-free items","免税商品"]],"grammar":"don't seem to be working 似乎不工作（seem to do 似乎；work 此处表\"正常运转\"）。","usage":"机上娱乐设施求助——第二个高频服务请求。"},{"speaker":"空乘","side":"other","en":"I'm sorry about that. I'll bring you a new pair right away.","zh":"很抱歉，我马上给您换一副新的。","words":[["a new pair","一副新的"],["right away","马上"]],"grammar":"I'm sorry about that 抱歉；bring you a new pair 双宾语；right away 立刻。","usage":"对应《领队英语》第二单元 在飞机上「第3课 要求机上服务」，空乘的常用表达。"},{"speaker":"游客","side":"other","en":"I'd like to buy some duty-free items from the in-flight catalog. Could you help me with this?","zh":"我想从机上目录买些免税品。你能帮我吗？","words":[["duty-free items","免税商品"],["in-flight catalog","机上购物目录"],["buy","购买"],["help me with","帮我..."],["adjust","调整"]],"grammar":"duty-free 免税的；in-flight 飞行中的（复合形容词）；catalog 目录。","usage":"第6版新增内容——机上购买免税品，对应第三课服务扩展。"},{"speaker":"空乘","side":"other","en":"Of course. You can pay by credit card or cash. Which items would you like?","zh":"可以。可以刷信用卡或付现金。您想要哪些商品？","words":[["credit card","信用卡"],["duty-free items","免税商品"]],"grammar":"pay by credit card or cash 用某种方式支付用 by；Which items would you like 疑问句。","usage":"对应《领队英语》第二单元 在飞机上「第3课 要求机上服务」，空乘的常用表达。"},{"speaker":"游客","side":"other","en":"Could you adjust the reading light for me? It's not bright enough.","zh":"能帮我调一下阅读灯吗？不够亮。","words":[["adjust","调整"],["reading light","阅读灯"],["bright enough","够亮"],["not...enough","不够"],["filled out","填完"]],"grammar":"adjust...for sb 为某人调节...；not + adj + enough 不够...；bright 亮。","usage":"机上照明调节——常见但容易被忽略的机上服务请求。"},{"speaker":"空乘","side":"other","en":"Let me adjust it for you. Is that better now?","zh":"我来帮您调一下。现在好点了吗？","words":[["adjust","调节"],["reading light","阅读灯"]],"grammar":"Let me adjust it 让我调整；Is that better now 比较级疑问句。","usage":"对应《领队英语》第二单元 在飞机上「第3课 要求机上服务」，空乘的常用表达。"}]},{"id":"d020","unit":"第二单元 在飞机上","unit_id":2,"name":"第4课 抵达目的地前","scene":"在飞机上","turns":[{"speaker":"领队","side":"leader","en":"Has everyone filled out the entry card and customs declaration form?","zh":"大家都填好入境卡和海关申报单了吗？","words":[["filled out","填完"],["entry card","入境卡"],["customs declaration form","海关申报单"],["everyone","每个人"],["need help with","需要帮助"]],"grammar":"fill out 填写（表单）；现在完成时 has filled out 表\"已完成\"。","usage":"对应《领队英语》第二单元第4课「抵达目的地前」，入境前必须完成填表。"},{"speaker":"游客","side":"other","en":"I'm not sure how to fill in this part — the address section.","zh":"这部分我不太会填——地址栏。","words":[["fill in","填写"],["address section","地址栏"]],"grammar":"how to fill in this part 疑问词+不定式；the address section 同位语。","usage":"对应《领队英语》第二单元 在飞机上「第4课 抵达目的地前」，游客的常用表达。"},{"speaker":"领队","side":"leader","en":"If you need help with the forms, please let me know. I'll come to your seat.","zh":"填表需要帮助的话请告诉我，我到您座位上来。","words":[["need help with","需要帮助"],["forms","表格"],["let me know","告诉我"],["come to your seat","到您座位"],["set your watch","调表"]],"grammar":"need help with + 名词 需要某方面的帮助；let me know 告知我；come to 来到。","usage":"领队主动巡视帮填表，是贴心服务的体现。"},{"speaker":"游客","side":"other","en":"Thank you! It's my first time filling in these forms.","zh":"谢谢！我第一次填这种表。","grammar":"It's my first time doing sth 第一次做某事。","usage":"对应《领队英语》第二单元 在飞机上「第4课 抵达目的地前」，游客的常用表达。","words":[["first time","第一次"],["filling in","填写"],["forms","表格"]]},{"speaker":"领队","side":"leader","en":"Please remember to set your watch to local time. The local time is now 3:00 PM.","zh":"请记得把手表调到当地时间。现在是下午三点。","words":[["set your watch","调表"],["local time","当地时间"],["remember to","记得要..."]],"grammar":"set...to... 把...调到...；remember to do 记得做某事（未做）；local time 当地时间。","usage":"降临前提醒时差调整——帮助团员尽快适应目的地作息。"},{"speaker":"游客","side":"other","en":"Got it. See you at the arrivals hall!","zh":"好的，到达大厅见！","words":[["arrivals hall","到达大厅"]],"grammar":"See you at the arrivals hall 告别用语。","usage":"对应《领队英语》第二单元 在飞机上「第4课 抵达目的地前」，游客的常用表达。"}]},{"id":"d021","unit":"第三单元 在酒店","unit_id":3,"name":"第1课 入住登记","scene":"在酒店","turns":[{"speaker":"领队","side":"leader","en":"Good afternoon. We are a tour group from China Comfort Travel Agency. My name is Ma Gang.","zh":"下午好。我们是中国康辉旅行社的旅游团，我叫马刚。","words":[["tour group","旅游团"],["China Comfort Travel Agency","中国康辉旅行社"],["Good afternoon","下午好"],["booked","预订了"]],"grammar":"from + 机构名 表\"来自某机构\"；介词 from 引出归属；tour group 旅游团。","usage":"对应《领队英语》第三单元第1课「入住登记」，领队在酒店前台的标准开场白。"},{"speaker":"前台","side":"other","en":"Good afternoon, Mr. Ma. Welcome! Let me check your reservation.","zh":"下午好，马先生。欢迎！我查一下您的预订。","words":[["reservation","预订"]],"grammar":"Welcome 欢迎；Let me check 让我查一下。","usage":"对应《领队英语》第三单元 在酒店「第1课 入住登记」，前台的常用表达。"},{"speaker":"领队","side":"leader","en":"Our agency booked five double rooms three weeks ago. The reservation should be under our agency's name.","zh":"我们旅行社三周前预订了五间双人房。预订应该在我们旅行社名下。","words":[["booked","预订了"],["double rooms","双人房"],["three weeks ago","三周前"],["under our agency's name","在我们旅行社名下"],["name list","名单"]],"grammar":"book 预订，过去式 booked；under one's name 在某人的名下；three weeks ago 三周前。","usage":"向酒店前台确认团队预订——报出预订单位和日期。"},{"speaker":"前台","side":"other","en":"Yes, I found it. Five double rooms for two nights, under China Comfort Travel.","zh":"找到了。康辉旅行社名下，五间双人房，住两晚。","words":[["double rooms","双人房"],["under...name","在...名下"]],"grammar":"I found it 我找到了；Five double rooms for two nights 数量+房型+晚数；under China Comfort Travel 以…名义。","usage":"对应《领队英语》第三单元 在酒店「第1课 入住登记」，前台的常用表达。"},{"speaker":"领队","side":"leader","en":"Here are the name list of our group and all the passports. Could we have the rooms on the same floor?","zh":"这是我们团名单和所有护照。能把房间安排在同一楼层吗？","words":[["name list","名单"],["on the same floor","在同一楼层"],["passports","护照"],["could we have","能给我们安排"],["extra bed","加床"]],"grammar":"name list 名单；on the same floor 同一楼层；could we have... 礼貌请求。","usage":"领队争取团队房间集中安排——方便管理和沟通。"},{"speaker":"前台","side":"other","en":"Certainly. I'll arrange rooms 301 to 305, all on the third floor. Here are your key cards.","zh":"可以。安排301到305房，都在三楼。这是房卡。","words":[["key cards","房卡"],["on the same floor","在同一楼层"]],"grammar":"arrange rooms 301 to 305 安排；on the third floor 在三楼。","usage":"对应《领队英语》第三单元 在酒店「第1课 入住登记」，前台的常用表达。"},{"speaker":"领队","side":"leader","en":"Great. What time is breakfast served?","zh":"太好了。早餐几点开始供应？","words":[["breakfast is served","早餐供应"]],"grammar":"What time is breakfast served 被动语态疑问句。","usage":"对应《领队英语》第三单元 在酒店「第1课 入住登记」，领队的常用表达。"},{"speaker":"前台","side":"other","en":"From 6:30 to 9:30 AM, in the restaurant on the second floor.","zh":"早上6点半到9点半，在二楼餐厅。","grammar":"From 6:30 to 9:30 AM 时间范围；on the second floor 在二楼。","usage":"对应《领队英语》第三单元 在酒店「第1课 入住登记」，前台的常用表达。","words":[["from...to","从…到"],["restaurant","餐厅"],["second floor","二楼"]]}]},{"id":"d022","unit":"第三单元 在酒店","unit_id":3,"name":"第2课 酒店内服务","scene":"在酒店","turns":[{"speaker":"领队","side":"leader","en":"Could we have an extra bed and some more bath towels in room 305, please?","zh":"305房间能加一张床和多送几条浴巾吗？","words":[["extra bed","加床"],["bath towels","浴巾"],["some more","更多一些"],["room 305","305房"],["laundry","要洗的衣物"]],"grammar":"extra + 名词 表\"额外的\"；some more 再来一些；bath towel 浴巾。","usage":"对应《领队英语》第三单元第2课「酒店内服务」，加床和补充日用品是常见服务请求。"},{"speaker":"前台","side":"other","en":"No problem. We'll send them up within 30 minutes.","zh":"没问题，30分钟内送到。","words":[["send them up","送上去"],["within 30 minutes","30分钟内"]],"grammar":"send them up 送上去；within 30 minutes 30分钟内。","usage":"对应《领队英语》第三单元 在酒店「第2课 酒店内服务」，前台的常用表达。"},{"speaker":"游客","side":"other","en":"I have some laundry that needs washing. When can I expect it back?","zh":"我有一些衣服需要洗。什么时候能送回来？","words":[["laundry","要洗的衣物"],["needs washing","需要洗"],["expect it back","期待送回"],["when can I","我什么时候能"],["Wi-Fi password","无线密码"]],"grammar":"need + doing = need to be done（主动形式被动含义）；laundry 要洗的衣物（不可数）。","usage":"酒店洗衣服务请求——对应第二课核心服务场景，需了解洗衣单填写。"},{"speaker":"前台","side":"other","en":"If we collect it before 9 AM, it will be returned the same evening.","zh":"早上9点前收走的话，当晚就能送回。","words":[["laundry","待洗衣物"],["the same evening","当晚"]],"grammar":"If we collect... it will be returned 条件状语从句+被动语态；the same evening 当晚。","usage":"对应《领队英语》第三单元 在酒店「第2课 酒店内服务」，前台的常用表达。"},{"speaker":"游客","side":"other","en":"Is the Wi-Fi password the same for all rooms? Where can I find it?","zh":"所有房间的Wi-Fi密码是一样的吗？在哪里能找到？","words":[["Wi-Fi password","无线密码"],["the same for all","对所有都一样"],["where can I find","哪里能找到"],["hot water","热水"]],"grammar":"the same for... 对...来说相同；where can I find... 询问位置。","usage":"第6版新增内容——现代旅行中Wi-Fi已成为必需品，领队需帮团员获取网络信息。"},{"speaker":"前台","side":"other","en":"Yes, one password for the whole hotel. It's printed on the card in your room.","zh":"是的，全酒店同一个密码，印在您房间里的卡片上。","words":[["Wi-Fi password","Wi-Fi密码"],["printed on","印在...上"]],"grammar":"one password for the whole hotel 全酒店一个密码；printed on the card 过去分词作定语。","usage":"对应《领队英语》第三单元 在酒店「第2课 酒店内服务」，前台的常用表达。"}]},{"id":"d023","unit":"第三单元 在酒店","unit_id":3,"name":"第3课 处理投诉","scene":"在酒店","turns":[{"speaker":"游客","side":"other","en":"There's no hot water in room 502. Could you send someone to check it?","zh":"502房间没有热水，能派人来看一下吗？","words":[["hot water","热水"],["send someone","派人"],["check it","查看一下"],["room 502","502房"],["air conditioner","空调"]],"grammar":"there's no + 名词 表\"没有...\"；send someone to do 派人做某事。","usage":"对应《领队英语》第三单元第3课「处理投诉」，热水问题是酒店最常见的投诉之一。"},{"speaker":"领队","side":"leader","en":"I'm sorry for the inconvenience. I'll contact the front desk and have them fix it right away.","zh":"很抱歉给您造成不便。我马上联系前台让他们来修。","words":[["inconvenience","不便"],["front desk","前台"],["fix it","修理"],["right away","马上"],["wake-up call","叫早电话"]],"grammar":"I'm sorry for + 名词 为...道歉；have sb do sth 让某人做某事；right away 立刻。","usage":"领队处理投诉的标准话术——先道歉、再行动、给承诺。"},{"speaker":"游客","side":"other","en":"The air conditioner in my room is not working properly. It's making a loud noise.","zh":"我房间的空调不正常，发出很大的噪音。","words":[["air conditioner","空调"],["not working properly","不正常运转"],["loud noise","大声响"],["making","发出"],["inconvenience","不便"]],"grammar":"not working properly 不能正常运转；make a noise 发出声响；air conditioner 空调。","usage":"第6版新增客房投诉场景——空调及设施故障处理。"},{"speaker":"领队","side":"leader","en":"I'll report that too. The hotel engineer will come to check within 20 minutes.","zh":"这个我也一起报修，酒店工程师傅20分钟内会来检查。","words":[["engineer","工程师傅"],["report","报修/报告"]],"grammar":"report that too 一起报修；come to check within 20 minutes 来检查。","usage":"对应《领队英语》第三单元 在酒店「第3课 处理投诉」，领队的常用表达。"},{"speaker":"前台","side":"other","en":"This is the front desk. We've sent the engineer to rooms 502 and 508. Sorry for the trouble.","zh":"这里是前台。我们已派工程师傅去502和508房，给您添麻烦了。","words":[["front desk","前台"]],"grammar":"This is the front desk 这里是前台；We've sent 现在完成时；Sorry for the trouble 抱歉添麻烦。","usage":"对应《领队英语》第三单元 在酒店「第3课 处理投诉」，前台的常用表达。"},{"speaker":"游客","side":"other","en":"Thank you for your quick help!","zh":"谢谢你处理得这么快！","grammar":"Thank you for your quick help 感谢快速处理。","usage":"对应《领队英语》第三单元 在酒店「第3课 处理投诉」，游客的常用表达。","words":[["quick","快速的"],["help","帮助"]]}]},{"id":"d024","unit":"第三单元 在酒店","unit_id":3,"name":"第4课 结账退房","scene":"在酒店","turns":[{"speaker":"领队","side":"leader","en":"Could you arrange a wake-up call at 5:30 AM for all our group rooms?","zh":"能为我们团所有房间安排早上五点半的叫早服务吗？","words":[["wake-up call","叫早电话"],["at 5:30 AM","早上五点半"],["all our group rooms","团所有房间"],["arrange","安排"],["have your luggage outside","把行李放在门外"]],"grammar":"arrange...for... 为...安排...；wake-up call 叫醒服务；at + 时间 在几点。","usage":"对应《领队英语》第三单元第4课「结账退房」，叫早是退房日标准流程——赶早班机必备。"},{"speaker":"前台","side":"other","en":"Certainly. 5:30 AM wake-up calls for all ten rooms.","zh":"好的，十个房间全部安排5点半叫早。","words":[["wake-up call","叫早服务"]],"grammar":"wake-up calls 叫早电话；for all ten rooms 表范围。","usage":"对应《领队英语》第三单元 在酒店「第4课 结账退房」，前台的常用表达。"},{"speaker":"领队","side":"leader","en":"Please have your luggage outside your room by 6:00 AM. The bellman will collect them.","zh":"请在早上六点前将行李放在房间门外，行李员会来收取。","words":[["have your luggage outside","把行李放在门外"],["bellman","行李员"],["collect","收取"],["by 6:00 AM","在早上六点前"],["check out","退房"]],"grammar":"have + 宾语 + 副词（outside）使...处于某状态；by + 时间 在...之前；bellman 行李员。","usage":"退房日出行李的标准指令——确保所有行李准时装车。"},{"speaker":"团员","side":"other","en":"Understood. Bags outside the door by 6 AM.","zh":"明白，早上6点前行李放门口。","grammar":"Bags outside the door by 6 AM 省略句；by 6 AM 到6点前。","usage":"对应《领队英语》第三单元 在酒店「第4课 结账退房」，团员的常用表达。","words":[["bags","行李"],["outside the door","门外"],["by 6 AM","6点前"]]},{"speaker":"领队","side":"leader","en":"I'd like to check out now. Here are the room keys. Could you prepare the bill for all 10 rooms?","zh":"我们现在退房。这是房卡。能准备全部十间房的账单吗？","words":[["check out","退房"],["prepare the bill","准备账单"],["all 10 rooms","全部十间房"],["room keys","房卡"],["store our luggage","寄存行李"]],"grammar":"check out 退房（结账离店）；prepare the bill 准备账单；for all 10 rooms 介短修饰 bill。","usage":"对应第四课核心对话——领队代表团队统一结账。"},{"speaker":"前台","side":"other","en":"Here is the bill for ten rooms. Please check it. Any minibar charges?","zh":"这是十间房的账单，请核对。迷你吧有消费吗？","words":[["bill","账单"],["minibar charges","迷你吧消费"]],"grammar":"Here is the bill 倒装句；Any minibar charges 省略疑问句。","usage":"对应《领队英语》第三单元 在酒店「第4课 结账退房」，前台的常用表达。"},{"speaker":"领队","side":"leader","en":"No minibar charges. Everything looks correct.","zh":"没有迷你吧消费，账单没问题。","grammar":"Everything looks correct 主系表结构。","usage":"对应《领队英语》第三单元 在酒店「第4课 结账退房」，领队的常用表达。","words":[["minibar","迷你吧"],["charges","费用"],["correct","正确的"]]},{"speaker":"领队","side":"leader","en":"Could we store our luggage at the bell desk after check-out? Our flight is not until 8:00 PM.","zh":"退房后能把行李寄存在行李寄存处吗？我们的航班晚上八点才飞。","words":[["store our luggage","寄存行李"],["bell desk","行李服务台"],["after check-out","退房后"],["not until 8 PM","直到晚上八点才"]],"grammar":"store 寄存；after check-out 退房后（介词短语）；not until... 直到...才。","usage":"退房后寄存行李——离店日和航班时间不衔接时的标准操作。"},{"speaker":"前台","side":"other","en":"Of course. Here are your luggage tags. You can collect them anytime before midnight.","zh":"可以。这是行李牌，今晚12点前随时可以来取。","words":[["luggage tags","行李牌"],["collect","领取"]],"grammar":"Here are your luggage tags 倒装句；anytime before midnight 随时。","usage":"对应《领队英语》第三单元 在酒店「第4课 结账退房」，前台的常用表达。"}]},{"id":"d025","unit":"第四单元 配合地陪","unit_id":4,"name":"第1课 与地陪在机场见面","scene":"配合地陪","turns":[{"speaker":"领队","side":"leader","en":"Excuse me, are you the local guide from CTS? I'm the tour leader from Beijing.","zh":"请问，你是中旅的地陪吗？我是来自北京的领队。","words":[["local guide","地陪/地接导游"],["CTS","中国旅行社"],["tour leader","领队"],["from Beijing","来自北京"],["in total","总共"]],"grammar":"Are you the...from... 确认身份；local guide 地陪（区别于 tour leader 领队）；CTS=China Travel Service。","usage":"对应《领队英语》第四单元第1课「与地陪在机场见面」，下飞机后第一件事——和地陪接上头。"},{"speaker":"地陪","side":"other","en":"Yes, I'm Li Ming from CTS. Welcome to Kunming, Mr. Wang!","zh":"是的，我是中旅的李明。王先生，欢迎来到昆明！","words":[["local guide","地陪"],["CTS","中国旅行社"]],"grammar":"I'm Li Ming from CTS 自我介绍；Welcome to Kunming 欢迎来到。","usage":"对应《领队英语》第四单元 配合地陪「第1课 与地陪在机场见面」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"How many pieces of luggage do we have in total? Let's count before we leave the airport.","zh":"我们一共有多少件行李？离开机场前我们点数核对一下。","words":[["in total","总共"],["count","清点"],["before we leave","离开前"],["pieces of luggage","件行李"],["All the luggage","所有行李"]],"grammar":"in total 总计；before we leave 离开前（before引导时间状语从句）；count 清点。","usage":"对应第一课行李交接环节——领队和地陪共同核对行李件数。"},{"speaker":"地陪","side":"other","en":"Good idea. Let me count with you... Twenty-one pieces in total.","zh":"好主意。我跟您一起数……一共21件。","words":[["in total","总共"],["count","点数"]],"grammar":"Let me count with you 让我一起数；Twenty-one pieces in total 总计。","usage":"对应《领队英语》第四单元 配合地陪「第1课 与地陪在机场见面」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"All the luggage is here. Please sign this luggage confirmation slip.","zh":"所有行李都齐了。请签一下行李确认单。","words":[["All the luggage","所有行李"],["sign","签字"],["confirmation slip","确认单"],["brief introduction","简要介绍"]],"grammar":"All the luggage is... luggage不可数名词，用单数谓语动词；confirmation slip 确认单。","usage":"行李交接的正式收尾——签字确认以防后续纠纷。"},{"speaker":"地陪","side":"other","en":"All right, signed. The bus is waiting outside. Let's go!","zh":"好的，签好了。车在外面等，我们走吧！","words":[["sign","签字"],["confirmation slip","确认单"]],"grammar":"signed 签好了；The bus is waiting outside 现在进行时；Let's go 祈使句。","usage":"对应《领队英语》第四单元 配合地陪「第1课 与地陪在机场见面」，地陪的常用表达。"}]},{"id":"d026","unit":"第四单元 配合地陪","unit_id":4,"name":"第2课 与地陪沟通","scene":"配合地陪","turns":[{"speaker":"领队","side":"leader","en":"Let me give you a brief introduction about our group. Most of them are first-time visitors.","zh":"我先简要介绍一下我们团的情况。大部分团员是第一次来。","words":[["brief introduction","简要介绍"],["first-time visitors","首次来访者"],["most of them","他们大部分"],["about our group","关于我们团"],["go over","过一遍/审查"]],"grammar":"give sb a brief introduction 给某人简要介绍；first-time 复合形容词\"首次的\"。","usage":"对应《领队英语》第四单元第2课「与地陪沟通」，领队向地陪介绍团员背景。"},{"speaker":"地陪","side":"other","en":"I see. Any special requirements — meals, pace, anything?","zh":"明白。有什么特别要求吗——餐饮、节奏方面？","words":[["special requirements","特殊要求"],["pace","节奏"]],"grammar":"Any special requirements 省略疑问句；meals, pace, anything 列举。","usage":"对应《领队英语》第四单元 配合地陪「第2课 与地陪沟通」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"Could we go over the itinerary together? I have a few suggestions from our group members.","zh":"我们一起过一遍行程好吗？团员们有一些建议。","words":[["go over","过一遍/审查"],["itinerary","行程"],["suggestions","建议"],["group members","团员"],["free time","自由时间"]],"grammar":"go over 仔细检查/过一遍；Could we... 礼貌提议；itinerary 行程安排。","usage":"对应第二课商谈旅游行程安排——领队代表团员与地陪协商调整。"},{"speaker":"地陪","side":"other","en":"Sure. Let's go through it day by day.","zh":"好的，我们按天过一遍。","words":[["go through","过一遍"],["day by day","逐日"]],"grammar":"Let's go through it day by day 逐天过一遍。","usage":"对应《领队英语》第四单元 配合地陪「第2课 与地陪沟通」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"Some tourists would like to have more free time for shopping. Can we adjust the afternoon schedule?","zh":"有些游客想多一些自由购物时间。我们能调整下午的安排吗？","words":[["free time","自由时间"],["shopping","购物"],["adjust","调整"],["afternoon schedule","下午安排"],["local guide","地陪"]],"grammar":"would like to have 想要有；more...for... 更多...用于...；adjust the schedule 调整行程。","usage":"对应第二课转达游客要求——领队是团员和地陪之间的桥梁。"},{"speaker":"地陪","side":"other","en":"We can shorten the museum visit to one hour and add free time at the market. How about that?","zh":"可以把博物馆参观压缩到一小时，空出时间逛集市。您看行吗？","words":[["shorten","缩短"],["free time","自由活动时间"]],"grammar":"shorten...to one hour 缩短到一小时；add free time 增加自由时间；How about that 怎么样。","usage":"对应《领队英语》第四单元 配合地陪「第2课 与地陪沟通」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"That works. I'll announce it to the group tonight.","zh":"可以，我今晚向全团宣布。","words":[["announce","宣布"]],"grammar":"That works 可以；announce it to the group 向全团宣布。","usage":"对应《领队英语》第四单元 配合地陪「第2课 与地陪沟通」，领队的常用表达。"}]},{"id":"d027","unit":"第四单元 配合地陪","unit_id":4,"name":"第3课 配合地陪工作","scene":"配合地陪","turns":[{"speaker":"领队","side":"leader","en":"Ladies and gentlemen, this is Mr. Liu, our local guide. He will take care of us during our stay.","zh":"各位贵宾，这位是刘先生，我们的地陪。在我们停留期间他将照顾大家。","words":[["local guide","地陪"],["take care of us","照顾我们"],["during our stay","停留期间"],["during the tour","游览中"]],"grammar":"This is...介绍人物；will take care of 将来时；during our stay 在停留期间。","usage":"对应《领队英语》第四单元第3课「配合地陪工作」——领队向全团介绍地陪。"},{"speaker":"地陪","side":"other","en":"Hello everyone, welcome! I hope you'll all enjoy your stay here.","zh":"大家好，欢迎！希望大家在这里玩得开心。","grammar":"I hope you'll all enjoy 宾语从句；enjoy your stay 享受旅程。","usage":"对应《领队英语》第四单元 配合地陪「第3课 配合地陪工作」，地陪的常用表达。","words":[["welcome","欢迎"],["enjoy your stay","玩得开心"]]},{"speaker":"领队","side":"leader","en":"If you have any questions during the tour, please feel free to ask either me or Mr. Liu.","zh":"游览中如有任何问题，请随时问我和刘先生。","words":[["during the tour","游览中"],["feel free to","随意/尽管"],["ask either me or","问我或"],["any questions","任何问题"],["a bit too spicy","太辣了一点"]],"grammar":"feel free to do 随意做/尽管做；either A or B A或B（二者之一）；during the tour 在游览期间。","usage":"领队和地陪分工明确——让团员知道有困难找谁。"},{"speaker":"团员","side":"other","en":"Understood. Thanks, Mr. Liu!","zh":"知道了，谢谢刘先生！","grammar":"Understood 明白；Thanks 谢谢。","usage":"对应《领队英语》第四单元 配合地陪「第3课 配合地陪工作」，团员的常用表达。","words":[["understood","明白"],["thanks","谢谢"]]},{"speaker":"领队","side":"leader","en":"Excuse me, Mr. Liu, the food at lunch was a bit too spicy for some of our group members. Could tomorrow's meals be milder?","zh":"刘先生，不好意思，午餐对一些团员来说太辣了。明天的餐能清淡一点吗？","words":[["a bit too spicy","太辣了一点"],["group members","团员"],["milder","更清淡"],["tomorrow's meals","明天的餐"],["lost his passport","丢了护照"]],"grammar":"a bit too + 形容词 有点太...；milder 更清淡（mild比较级）；Could...be... 请求调整。","usage":"对应第三课安排就餐及交涉饭菜质量——领队代表团员反馈问题。"},{"speaker":"地陪","side":"other","en":"I'm sorry to hear that. I'll tell the restaurant to prepare milder dishes from tomorrow.","zh":"很抱歉。我明天起让餐厅做清淡一些。","words":[["milder dishes","清淡的菜"],["spicy","辣的"]],"grammar":"I'm sorry to hear that 听到很难过；tell the restaurant to prepare milder dishes 不定式作宾补。","usage":"对应《领队英语》第四单元 配合地陪「第3课 配合地陪工作」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"Thank you. The group will really appreciate it.","zh":"谢谢，团员们会很感激的。","words":[["appreciate","感激"]],"grammar":"The group will really appreciate it 将来时。","usage":"对应《领队英语》第四单元 配合地陪「第3课 配合地陪工作」，领队的常用表达。"}]},{"id":"d028","unit":"第四单元 配合地陪","unit_id":4,"name":"第4课 特殊情况处理","scene":"配合地陪","turns":[{"speaker":"领队","side":"leader","en":"One of our tourists has lost his passport. When should we report to the police and the embassy?","zh":"我们一个团员的护照丢了。我们应该什么时候去警察局和大使馆报案？","words":[["lost his passport","丢了护照"],["report to","向...报告"],["the police","警察"],["embassy","大使馆"],["missing one tourist","走丢一位游客"]],"grammar":"has lost 现在完成时；report to... 向...报告；embassy 大使馆（注意重音在第一音节）。","usage":"对应《领队英语》第四单元第4课「应对特殊情况」——护照遗失是最严重的突发事件之一。"},{"speaker":"地陪","side":"other","en":"Right away — first to the police station for a loss report, then to the consulate for a travel document.","zh":"马上办——先去警察局开遗失证明，再去领事馆补办旅行证。","words":[["police station","警察局"],["consulate","领事馆"],["loss report","遗失证明"]],"grammar":"first...then... 先…然后…；a loss report 遗失证明；a travel document 旅行证。","usage":"对应《领队英语》第四单元 配合地陪「第4课 特殊情况处理」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"We're missing one tourist. She was last seen at the souvenir shop near the entrance.","zh":"我们走丢了一位游客。最后看到她在入口附近的纪念品店。","words":[["missing one tourist","走丢一位游客"],["last seen at","最后被看到在"],["souvenir shop","纪念品店"],["near the entrance","入口附近"],["feeling sick","不舒服"]],"grammar":"is missing 不见了/走丢了；was last seen 最后被看见（被动语态）。","usage":"对应第四课寻找走失游客——景点人多时最常见的突发事件。"},{"speaker":"地陪","side":"other","en":"I'll ask the site office to make a broadcast. Let's split up and search near the entrance.","zh":"我让景区管理处广播寻人。我们分头在入口附近找。","words":[["make a broadcast","广播寻人"],["split up","分头"]],"grammar":"ask the site office to make a broadcast 请人做某事；split up 分头；search near the entrance 在入口附近找。","usage":"对应《领队英语》第四单元 配合地陪「第4课 特殊情况处理」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"One tourist is feeling sick after lunch. She might have food poisoning. We need to see a doctor immediately.","zh":"一位游客午饭后不舒服，可能是食物中毒。我们需要马上去看医生。","words":[["feeling sick","不舒服"],["food poisoning","食物中毒"],["see a doctor","看医生"],["immediately","立刻"],["in case of emergency","如遇紧急情况"]],"grammar":"feel sick 感到不适/恶心；might have 可能得了；food poisoning 食物中毒；need to do 需要做。","usage":"对应第四课面对突发疾病——食物中毒需要立即就医。"},{"speaker":"地陪","side":"other","en":"There's a clinic five minutes away. I'll call a taxi right now.","zh":"五分钟车程外有家诊所，我现在叫车。","words":[["clinic","诊所"],["right now","马上"]],"grammar":"There's a clinic five minutes away 距离表达；call a taxi right now 立刻叫车。","usage":"对应《领队英语》第四单元 配合地陪「第4课 特殊情况处理」，地陪的常用表达。"},{"speaker":"领队","side":"leader","en":"In case of emergency, please remain calm and follow my instructions. I will handle the situation.","zh":"遇紧急情况请保持冷静，听从我的指挥。我来处理。","words":[["in case of emergency","如遇紧急情况"],["remain calm","保持冷静"],["follow my instructions","听从指挥"],["handle the situation","处理情况"]],"grammar":"in case of + 名词 如遇/万一...；remain 系动词+形容词；handle 处理。","usage":"应对一切突发情况的万能话术——领队的镇定是团队的安全感来源。"}]},{"id":"d029","unit":"第五单元 自由活动日","unit_id":5,"name":"第1课 货币兑换","scene":"自由活动日","turns":[{"speaker":"领队","side":"leader","en":"Excuse me, where is the nearest currency exchange? I need to change some US dollars into Thai baht.","zh":"请问最近的货币兑换处在哪里？我需要把美元换成泰铢。","words":[["currency exchange","货币兑换"],["change...into","把...换成"],["Thai baht","泰铢"],["nearest","最近的"],["exchange rate","汇率"]],"grammar":"the nearest + 名词 最近的...；change A into B 把A换成B；currency 货币。","usage":"对应《领队英语》第五单元第1课「货币兑换」，自由活动日最迫切的需求——换当地货币。"},{"speaker":"路人","side":"other","en":"There's one around the corner, next to the bank.","zh":"拐角处就有一家，在银行旁边。","words":[["around the corner","在拐角处"]],"grammar":"There's one around the corner 拐角处有一家；next to the bank 银行旁边。","usage":"对应《领队英语》第五单元 自由活动日「第1课 货币兑换」，路人的常用表达。"},{"speaker":"领队","side":"leader","en":"What's the exchange rate for US dollars today? And is there any service charge?","zh":"今天美元汇率多少？有手续费吗？","words":[["exchange rate","汇率"],["US dollars","美元"],["service charge","手续费"],["today","今天"],["traveler's checks","旅行支票"]],"grammar":"What's the exchange rate for... ...的汇率是多少；service charge 服务费/手续费。","usage":"对应第一课兑换货币的核心问题——了解汇率和费用。"},{"speaker":"兑换员","side":"other","en":"Today's rate is 34.5 baht per dollar, with a 2% service charge.","zh":"今天汇率是1美元兑34.5泰铢，收2%手续费。","words":[["exchange rate","汇率"],["service charge","手续费"]],"grammar":"Today's rate is 34.5 baht per dollar 每美元34.5泰铢；a 2% service charge 手续费。","usage":"对应《领队英语》第五单元 自由活动日「第1课 货币兑换」，兑换员的常用表达。"},{"speaker":"游客","side":"other","en":"Can I use my traveler's checks here? Or is there an ATM nearby where I can withdraw cash?","zh":"这里可以用旅行支票吗？或者附近有ATM机可以取现金？","words":[["traveler's checks","旅行支票"],["ATM","自动取款机"],["withdraw cash","取现金"],["nearby","附近"],["duty-free shop","免税店"]],"grammar":"traveler's checks 旅行支票；withdraw（提取）的过去式 withdrew；ATM = Automatic Teller Machine。","usage":"对应第一课旅行支票和自动取款机取钱内容——多种支付方式。"},{"speaker":"兑换员","side":"other","en":"Yes, we accept traveler's checks. The ATM is just outside, on the left.","zh":"可以，我们受理旅行支票。ATM就在门外左手边。","words":[["traveler's checks","旅行支票"],["ATM","自动取款机"]],"grammar":"we accept traveler's checks 受理旅行支票；on the left 左边。","usage":"对应《领队英语》第五单元 自由活动日「第1课 货币兑换」，兑换员的常用表达。"}]},{"id":"d030","unit":"第五单元 自由活动日","unit_id":5,"name":"第2课 购物","scene":"自由活动日","turns":[{"speaker":"游客","side":"other","en":"Is this a duty-free shop? Can I get a tax refund on these purchases?","zh":"这是免税店吗？这些东西能退税吗？","words":[["duty-free shop","免税店"],["tax refund","退税"],["purchases","购买的物品"],["get a...on","在...上获得"],["give us a discount","给我们折扣"]],"grammar":"duty-free 免税的（duty=关税/税，非\"职责\"）；tax refund 退税；get...on... 通过...获得...。","usage":"对应《领队英语》第五单元第2课「购物」——帮团员识别免税店和退税资格。"},{"speaker":"店员","side":"other","en":"Yes, it is. Purchases over 5,000 yen qualify for a tax refund.","zh":"是的。购物满5000日元可以退税。","words":[["qualify for","符合...资格"]],"grammar":"Purchases over 5,000 yen qualify for a tax refund 满额退税。","usage":"对应《领队英语》第五单元 自由活动日「第2课 购物」，店员的常用表达。"},{"speaker":"领队","side":"leader","en":"Could you give us a discount if we buy more? We are a group of 20 people.","zh":"多买能给折扣吗？我们是20人的团。","words":[["give us a discount","给我们折扣"],["buy more","多买"],["a group of","一群/一个团"],["if we buy more","如果我们多买"],["return this item","退还商品"]],"grammar":"give a discount 给折扣；if + 条件句 + 主句 标准条件句型；buy more 买更多。","usage":"对应第二课协助购物——领队帮团员争取团队折扣。"},{"speaker":"店员","side":"other","en":"For a group of 20, I can offer 10% off everything.","zh":"20人的团，我可以给全场九折。","words":[["10% off","九折"],["discount","折扣"]],"grammar":"For a group of 20 定语；offer 10% off 打九折；everything 全部。","usage":"对应《领队英语》第五单元 自由活动日「第2课 购物」，店员的常用表达。"},{"speaker":"游客","side":"other","en":"Can I return this item and get a refund? I have the receipt here.","zh":"我能退这个商品并退款吗？收据在这里。","words":[["return this item","退还商品"],["get a refund","退款"],["receipt","收据"],["have...here","...在这里"],["price tag","价格标签"]],"grammar":"return 退还；refund 退款（re回+fund资金）；have the receipt here 拿着收据。","usage":"对应第二课超市退货内容——购物纠纷是自由活动日常见问题。"},{"speaker":"店员","side":"other","en":"No problem. Returns are accepted within seven days with the receipt.","zh":"没问题，七天之内凭收据可以退货。","words":[["return","退货"],["within seven days","七天内"]],"grammar":"Returns are accepted within seven days 被动语态；with the receipt 凭收据。","usage":"对应《领队英语》第五单元 自由活动日「第2课 购物」，店员的常用表达。"},{"speaker":"游客","side":"other","en":"The price tag says 250 yuan. Can I pay by Alipay or WeChat Pay?","zh":"标价是250元。能用支付宝或微信支付吗？","words":[["price tag","价格标签"],["Alipay","支付宝"],["WeChat Pay","微信支付"],["pay by","用...支付"],["see the menu","看菜单"]],"grammar":"price tag 价格标签；pay by + 支付方式 以...方式支付。","usage":"第6版新增——用Alipay等新的线上支付方式结账的内容。"},{"speaker":"店员","side":"other","en":"Both work. Please scan this QR code.","zh":"都可以，请扫这个二维码。","words":[["QR code","二维码"],["scan","扫码"]],"grammar":"Both work 两个都行；scan this QR code 扫二维码。","usage":"对应《领队英语》第五单元 自由活动日「第2课 购物」，店员的常用表达。"}]},{"id":"d031","unit":"第五单元 自由活动日","unit_id":5,"name":"第3课 餐馆就餐","scene":"自由活动日","turns":[{"speaker":"领队","side":"leader","en":"Could we see the menu, please? Do you have an English menu?","zh":"能看一下菜单吗？有英文菜单吗？","words":[["see the menu","看菜单"],["English menu","英文菜单"],["do you have","你有...吗"],["order","点（菜）"]],"grammar":"Could we see... 礼貌请求看...；menu 菜单；an English menu 一份英文菜单。","usage":"对应《领队英语》第五单元第3课「餐馆就餐」，领队帮团员点菜的第一步——拿菜单。"},{"speaker":"服务员","side":"other","en":"Of course. Here is the English menu.","zh":"好的，这是英文菜单。","grammar":"Here is the English menu 倒装句。","usage":"对应《领队英语》第五单元 自由活动日「第3课 餐馆就餐」，服务员的常用表达。","words":[["of course","当然"],["menu","菜单"]]},{"speaker":"领队","side":"leader","en":"We'd like to order some local specialties. What do you recommend?","zh":"我们想点一些当地特色菜。你推荐什么？","words":[["order","点（菜）"],["local specialties","当地特色菜"],["recommend","推荐"],["what do you","你...什么"],["separate bills","分开的账单"]],"grammar":"We'd like to order 我们想点；local specialties 特色菜（specialty 特产/专长）；recommend 推荐。","usage":"对应第三课点菜环节——让地陪或服务员推荐是聪明做法。"},{"speaker":"服务员","side":"other","en":"The roast duck and the handmade noodles are our most popular dishes.","zh":"烤鸭和手工面是我们最受欢迎的菜。","words":[["roast duck","烤鸭"],["popular dishes","热门菜"]],"grammar":"The roast duck and the handmade noodles 并列主语；our most popular dishes 最受欢迎的菜。","usage":"对应《领队英语》第五单元 自由活动日「第3课 餐馆就餐」，服务员的常用表达。"},{"speaker":"游客","side":"other","en":"Could we have separate bills, please? Each person pays for their own meal.","zh":"能分开结账吗？各付各的。","words":[["separate bills","分开的账单"],["each person","每人"],["pays for their own","各付各的"],["meal","餐"],["cappuccino","卡布奇诺"]],"grammar":"separate bills 分开的账单；each person 每人（单数谓语动词）；pay for 为...付钱。","usage":"对应第三课付账环节——自由活动日团员自行用餐，分开结账很正常。"},{"speaker":"服务员","side":"other","en":"No problem. I'll split the bill by seat number.","zh":"没问题，我按座位号分开结账。","words":[["split the bill","分单"],["by seat number","按座位号"]],"grammar":"split the bill 分开结账；by seat number 按座位号。","usage":"对应《领队英语》第五单元 自由活动日「第3课 餐馆就餐」，服务员的常用表达。"},{"speaker":"游客","side":"other","en":"I'd like a cappuccino, please. And can I have the bill when you're ready?","zh":"我要一杯卡布奇诺。方便时能给我账单吗？","words":[["cappuccino","卡布奇诺"],["the bill","账单"],["when you're ready","方便时"],["I'd like","我想要"],["subway line","地铁线路"]],"grammar":"cappuccino 卡布奇诺咖啡；the bill 账单（注意拼写）；when you're ready 你准备好了的时候。","usage":"第6版新增——购买咖啡饮料的场景，现代游客的日常需求。"},{"speaker":"服务员","side":"other","en":"One cappuccino, and I'll bring your bill right away.","zh":"一杯卡布奇诺，账单我马上拿来。","grammar":"One cappuccino 省略句点单；bring your bill right away 马上拿账单。","usage":"对应《领队英语》第五单元 自由活动日「第3课 餐馆就餐」，服务员的常用表达。","words":[["cappuccino","卡布奇诺"],["bill","账单"],["right away","马上"]]}]},{"id":"d032","unit":"第五单元 自由活动日","unit_id":5,"name":"第4课 交通","scene":"自由活动日","turns":[{"speaker":"游客","side":"other","en":"Which subway line goes to the city center? And where is the nearest station?","zh":"哪条地铁线到市中心？最近的车站在哪里？","words":[["subway line","地铁线路"],["city center","市中心"],["nearest station","最近的车站"],["goes to","通往"],["call...taxis","叫出租车"]],"grammar":"which + 名词 + 谓语 哪条...；goes to 通往（第三人称单数）；subway 地铁（美式，英式用tube/underground）。","usage":"对应《领队英语》第五单元第4课「交通」——自由活动日帮团员问公共交通。"},{"speaker":"领队","side":"leader","en":"Line 2 goes straight to the city center. The nearest station is 200 meters ahead, on the left.","zh":"2号线直达市中心，最近的车站在前面200米左手边。","words":[["goes straight to","直达"],["ahead","在前面"]],"grammar":"goes straight to the city center 直达市中心；200 meters ahead 前方200米。","usage":"对应《领队英语》第五单元 自由活动日「第4课 交通」，领队的常用表达。"},{"speaker":"领队","side":"leader","en":"Could you call two taxis for us? We're eight people in total.","zh":"能帮我们叫两辆出租车吗？我们一共八个人。","words":[["call...taxis","叫出租车"],["eight people","八个人"],["in total","总共"],["bus fare","公交车费"]],"grammar":"call a taxi 叫出租车；in total 总共；Could you + 动词原形 礼貌请求。","usage":"对应第四课乘坐出租车——人数多时要分车，提前算好。"},{"speaker":"酒店员工","side":"other","en":"Two taxis, no problem. They'll arrive in about five minutes.","zh":"两辆出租车，没问题，大约五分钟到。","grammar":"Two taxis, no problem 省略句；in about five minutes 大约五分钟。","usage":"对应《领队英语》第五单元 自由活动日「第4课 交通」，酒店员工的常用表达。","words":[["taxis","出租车"],["no problem","没问题"],["arrive","到达"]]},{"speaker":"游客","side":"other","en":"How much is the bus fare to the downtown area? Do I need exact change?","zh":"去市区的公交车票多少钱？需要准备正好的零钱吗？","words":[["bus fare","公交车费"],["downtown area","市中心区"],["exact change","正好的零钱"],["need","需要"],["last bus","末班车"]],"grammar":"fare 公共交通票价（区别于 fee/price）；downtown 市中心（美式）；exact change 不需要找零的金额。","usage":"对应第四课乘坐公共巴士——不同城市公交规则不同，提前问清楚。"},{"speaker":"领队","side":"leader","en":"Two yuan per person. Buses don't give change, so prepare coins.","zh":"每人2元。公交不找零，准备好硬币。","words":[["give change","找零"],["coins","硬币"]],"grammar":"Two yuan per person 每人两元；don't give change 不找零；prepare coins 准备硬币。","usage":"对应《领队英语》第五单元 自由活动日「第4课 交通」，领队的常用表达。"},{"speaker":"游客","side":"other","en":"What time is the last bus back to our hotel? We don't want to miss it.","zh":"回酒店的末班车是几点？我们不想错过。","words":[["last bus","末班车"],["back to our hotel","回酒店"],["don't want to miss","不想错过"],["what time","几点"],["airmail letter","航空信件"]],"grammar":"last bus 末班车；back to... 回到...；miss 错过（=没赶上）。","usage":"安全提醒——确认末班车时间，防止团员夜归无车。"},{"speaker":"领队","side":"l function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterday(){const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const DAY_MS=864e5;

const LS_KEY='wb_tourleader_english_v3';
function defaultState(){return{dialogueProgress:{},dailyLog:{},checkins:[],totalDays:0,wordBook:[],wordCard:{}}}
let state;
function loadState(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){try{state=JSON.parse(raw);if(!state.wordBook)state.wordBook=[];if(!state.wordCard)state.wordCard={}}catch(e){state=defaultState()}}
  else{
    state=defaultState();
    const yd=yesterday();
    state.dailyLog[yd]={newUnit:'d001',reviewUnit:null,done:false};
  }
  saveState();
}
function saveState(){localStorage.setItem(LS_KEY,JSON.stringify(state))}
function getTodayAssignment(){
  const td=today();
  if(state.dailyLog[td]) return state.dailyLog[td];
  const learned=new Set(Object.keys(state.dialogueProgress).filter(k=>state.dialogueProgress[k].learned));
  let newUnit=null;
  for(let u of DIALOGUE_UNITS){if(!learned.has(u.id)){newUnit=u.id;break}}
  let reviewUnit=null;
  if(learned.size>0){
    const learnedList=Array.from(learned).map(id=>({id,lastReview:state.dialogueProgress[id].lastReview||'1970-01-01'})).sort((a,b)=>a.lastReview.localeCompare(b.lastReview));
    for(let l of learnedList){if(l.id!==newUnit){reviewUnit=l.id;break}}
  }
  state.dailyLog[td]={newUnit,reviewUnit,done:false};
  saveState();
  return state.dailyLog[td];
}
function findUnitById(id){return DIALOGUE_UNITS.find(u=>u.id===id)}
function renderTodayAlert(){
  const yd=yesterday();
  const ydLog=state.dailyLog[yd];
  let html='';
  if(ydLog && !ydLog.done && ydLog.newUnit){
    const u=findUnitById(ydLog.newUnit);
    if(u && !(state.dialogueProgress[ydLog.newUnit] && state.dialogueProgress[ydLog.newUnit].learned)){
      html+='<div class="today-banner overdue"><div class="today-label">昨天未打卡 — 已自动顺延到今天</div>'
        +'<div style="font-size:14px;font-weight:600">'+u.name+' <span style="font-size:12px;color:var(--mute)">'+u.unit+'</span></div></div>';
    }
  }
  $('todayAlert').innerHTML=html;
}

function calcStreak(){
  let s=0;
  for(let i=0;i<365;i++){
    const d=new Date(Date.now()-i*DAY_MS);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(state.dailyLog[ds]&&state.dailyLog[ds].done)s++;else break;
  }
  return s;
}
function getReviewQueue(){
  const learned=Object.keys(state.dialogueProgress).filter(k=>state.dialogueProgress[k].learned);
  return learned.map(id=>({id,name:(findUnitById(id)||{name:id}).name,count:state.dialogueProgress[id].reviewCount||0,lastReview:state.dialogueProgress[id].lastReview||null}))
    .sort((a,b)=>(a.lastReview||'1970-01-01').localeCompare(b.lastReview||'1970-01-01'));
}
function doCheckin(){
  const asgn=getTodayAssignment();
  if(asgn.done){toast('今天已经打卡过了');return}
  if(asgn.newUnit){
    if(!state.dialogueProgress[asgn.newUnit])state.dialogueProgress[asgn.newUnit]={learned:false,date:null,reviewCount:0,lastReview:null};
    state.dialogueProgress[asgn.newUnit].learned=true;
    state.dialogueProgress[asgn.newUnit].date=today();
  }
  if(asgn.reviewUnit){
    if(!state.dialogueProgress[asgn.reviewUnit])state.dialogueProgress[asgn.reviewUnit]={learned:true,date:null,reviewCount:0,lastReview:null};
    state.dialogueProgress[asgn.reviewUnit].reviewCount=(state.dialogueProgress[asgn.reviewUnit].reviewCount||0)+1;
    state.dialogueProgress[asgn.reviewUnit].lastReview=today();
  }
  asgn.done=true;
  state.dailyLog[today()]=asgn;
  if(!state.checkins.includes(today()))state.checkins.push(today());
  state.totalDays=(state.totalDays||0)+1;
  saveState();
  refreshAll();
  toast('打卡成功！明天继续加油');

}

const CARDS_PER_DAY=20;

function seedFromDate(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function drawCardIds(nonce){
  const idxs=WORDS.map(function(w,i){return i});
  const rnd=mulberry32(seedFromDate(today()+'|'+(nonce||0)));
  for(let i=idxs.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const tmp=idxs[i];idxs[i]=idxs[j];idxs[j]=tmp}
  return idxs.slice(0,Math.min(CARDS_PER_DAY,WORDS.length));
}

function markCard(ok){
  const c=ensureCards();
  let i=c.idx;
  if(i<0)i=0;
  if(i>=c.ids.length)i=c.ids.length-1;
  c.idx=i;
  const w=WORDS[c.ids[i]];
  if(!w)return;
  const pos=c.known.indexOf(w.word);
  if(ok&&pos<0)c.known.push(w.word);
  if(!ok&&pos>=0)c.known.splice(pos,1);
  if(!ok){
    if(!state.wordBook.some(function(x){return x.word===w.word})){
      state.wordBook.push({word:w.word,zh:w.zh,src:w.src||'',added:today()});
      toast('已加入生词本');
    }
  }
  saveState();
  cardsFlipped=false;
  c.idx++;
  if(c.idx>=c.ids.length){c.idx=0;toast('本轮完成，重新开始');}
  renderWordCards();

function answerReview(word){
  word=decodeURIComponent(word);
  const cur=wbReviewQueue[wbReviewIdx];
  const btns=document.querySelectorAll('.wb-opt');
  const correct=word===cur.word;
  if(correct)wbReviewScore++;
  const wrongZh=state.wordBook.find(x=>x.word===word)?.zh;
  btns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===cur.zh)b.classList.add('correct');
    else if(wrongZh&&b.textContent===wrongZh)b.classList.add('wrong');
  });
  if(!correct)toast('正确答案：'+cur.zh);
  setTimeout(()=>{wbReviewIdx++;renderWordReview()},1200);
}
function exitWordReview(){
  wbReviewMode=false;renderWordBook();
}
function toggleDetail(key){
  const el=$('detail-'+key);
  const btn=el.previousElementSibling.querySelector('.expand-btn')||el.previousElementSibling;
  if(el.classList.contains('show')){el.classList.remove('show');if(btn.tagName==='BUTTON')btn.textContent='讲解 ▾'}
  else{el.classList.add('show');if(btn.tagName==='BUTTON')btn.textContent='收起 ▴'}
}
let currentTab='today';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.mobile-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const dt=document.querySelectorAll('#tabNav .tab-btn');
  const mt=document.querySelectorAll('#mobileTabs .mobile-tab');
  const i=tab==='today'?0:tab==='courses'?1:tab==='words'?2:tab==='cards'?3:tab==='wordbook'?4:5;
  dt[i].classList.add('active');mt[i].classList.add('active');
  if(dt[i]&&dt[i].scrollIntoView){try{dt[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}catch(e){}}
  $('panel-'+tab).classList.add('active');
  if(tab==='today')renderToday();else if(tab==='courses')renderCourses();else if(tab==='words')renderWordList();else if(tab==='cards')renderWordCards();else if(tab==='wordbook')renderWordBook();else renderProgress();
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='领队英语学习台_备份_'+today()+'.json';a.click();
  URL.revokeObjectURL(url);
  toast('备份已下载 ✓');
}
function importData(){$('fileInput').click()}
function handleFileImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.dialogueProgress!==undefined&&data.dailyLog!==undefined){
        state=data;saveState();refreshAll();toast('数据恢复成功 ✓');
      }else toast('文件格式不正确');
    }catch(ex){toast('文件解析失败')}
  };
  reader.readAsText(file);e.target.value='';
}
function clearData(){$('clearModal').classList.add('show')}
function closeClearModal(){$('clearModal').classList.remove('show')}
function doClear(){
  state=defaultState();saveState();closeClearModal();refreshAll();toast('数据已清空');
}
function refreshAll(){
  renderTodayAlert();
  if(currentTab==='today')renderToday();else if(currentTab==='courses')renderCourses();else if(currentTab==='words')renderWordList();else if(currentTab==='cards')renderWordCards();else if(currentTab==='wordbook')renderWordBook();else renderProgress();
  if(state.checkins&&state.checkins.length>=30){
    $('dataHint').textContent='数据已积累'+state.checkins.length+'天，建议导出备份';
    $('dataHint').style.display='inline';
  }
}
loadState();
getTodayAssignment();
renderTodayAlert();
renderToday();
renderCourses();
renderWordList();
renderWordCards();
renderWordBook();
renderProgress();
</script>
